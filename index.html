<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TPAC 학습노트</title>
<style>
  :root{
    --ink:#1c2b39;
    --paper:#eef0ea;
    --card:#ffffff;
    --line:#d8dcd3;
    --pass:#2f6e57;
    --fail:#a83a1d;
    --gold:#b8892b;
    --muted:#5b6570;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 40px;}

  header{
    padding:20px 16px 14px;
    border-bottom:2px solid var(--ink);
    background:var(--card);
  }
  header .row{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;}
  h1{
    font-family:"Noto Serif KR","Nanum Myeongjo",serif;
    font-weight:700;
    font-size:22px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .datebadge{
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11px;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:3px;
    padding:3px 7px;
    white-space:nowrap;
  }
  .subtitle{
    max-width:640px;margin:6px auto 0;
    font-size:12.5px;color:var(--muted);
    font-family:"SFMono-Regular",Consolas,monospace;
    letter-spacing:0.01em;
  }

  nav.tabs{
    display:flex;
    max-width:640px;margin:0 auto;
    background:var(--card);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10;
  }
  nav.tabs button{
    flex:1;
    padding:13px 4px;
    background:none;border:none;
    font-size:14.5px;font-weight:600;
    color:var(--muted);
    border-bottom:3px solid transparent;
    font-family:inherit;
    cursor:pointer;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--ink);}

  main{padding-top:18px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
    margin-bottom:14px;
  }

  .chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chip{
    padding:8px 13px;
    border:1.5px solid var(--ink);
    border-radius:999px;
    background:var(--card);
    color:var(--ink);
    font-size:13px;font-weight:600;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .chip.active{background:var(--ink);color:#fff;}

  .sectionlabel{
    font-size:11px;letter-spacing:0.06em;color:var(--muted);
    font-family:"SFMono-Regular",Consolas,monospace;
    text-transform:uppercase;margin:0 0 8px;
  }

  .countrow{display:flex;gap:8px;margin-bottom:16px;}
  .countbtn{
    flex:1;padding:10px 0;
    border:1.5px solid var(--line);
    background:var(--card);border-radius:6px;
    font-weight:700;font-size:14px;color:var(--ink);
    cursor:pointer;font-family:inherit;
  }
  .countbtn.active{border-color:var(--ink);background:var(--ink);color:#fff;}

  .bigbtn{
    width:100%;padding:15px 0;
    background:var(--ink);color:#fff;
    border:none;border-radius:8px;
    font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;
    letter-spacing:-0.01em;
  }
  .bigbtn:active{opacity:0.85;}
  .bigbtn.secondary{background:var(--card);color:var(--ink);border:1.5px solid var(--ink);}
  .bigbtn.fail{background:var(--fail);}

  .progresswrap{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
    font-family:"SFMono-Regular",Consolas,monospace;font-size:12.5px;color:var(--muted);
  }
  .progressbar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
  .progressbar > div{height:100%;background:var(--ink);}

  .qtag{
    display:inline-block;font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11px;color:var(--muted);border:1px solid var(--line);
    border-radius:3px;padding:2px 7px;margin-bottom:10px;
  }
  .qtext{font-size:16px;line-height:1.55;font-weight:600;margin:0 0 16px;}

  .choice{
    display:flex;align-items:flex-start;gap:10px;
    width:100%;text-align:left;
    padding:13px 14px;margin-bottom:9px;
    border:1.5px solid var(--line);border-radius:8px;
    background:var(--card);
    font-family:inherit;font-size:14.5px;line-height:1.45;
    color:var(--ink);cursor:pointer;
    min-height:48px;
  }
  .choice .num{
    font-family:"SFMono-Regular",Consolas,monospace;
    font-weight:700;color:var(--muted);flex-shrink:0;
  }
  .choice.selected{border-color:var(--ink);border-width:2px;background:#f7f8f5;}
  .choice.correct{border-color:var(--pass);background:#eaf3ef;}
  .choice.correct .num{color:var(--pass);}
  .choice.wrong{border-color:var(--fail);background:#f8ece7;}
  .choice.wrong .num{color:var(--fail);}
  .choice:disabled, .choice[data-locked="1"]{cursor:default;}

  .explain{
    margin-top:12px;padding:12px 14px;
    background:#f7f8f5;border-left:3px solid var(--ink);
    border-radius:4px;font-size:13.5px;line-height:1.55;color:var(--muted);
  }

  .navrow{display:flex;gap:10px;margin-top:16px;}
  .navrow .bigbtn{flex:1;}

  /* stamp */
  .stampwrap{display:flex;justify-content:center;margin:8px 0 20px;}
  .stamp{
    width:132px;height:132px;border-radius:50%;
    border:3px double var(--pass);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-9deg);
    color:var(--pass);
    font-family:"Noto Serif KR","Nanum Myeongjo",serif;
  }
  .stamp.fail{border-color:var(--fail);color:var(--fail);}
  .stamp .top{font-size:10px;letter-spacing:0.15em;font-family:"SFMono-Regular",Consolas,monospace;}
  .stamp .score{font-size:30px;font-weight:900;line-height:1.1;margin:2px 0;}
  .stamp .tier{font-size:13px;font-weight:700;letter-spacing:0.05em;}

  .resulthead{text-align:center;margin-bottom:4px;}
  .resulthead .big{font-size:15px;font-weight:700;color:var(--muted);}

  .breakrow{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;
  }
  .breakrow:last-child{border-bottom:none;}
  .breakbar{flex:1;height:6px;background:var(--line);border-radius:3px;margin:0 10px;overflow:hidden;}
  .breakbar>div{height:100%;background:var(--ink);}

  .note-card{
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:14px;margin-bottom:12px;
  }
  .note-card .qtag{margin-bottom:8px;}
  .note-line{display:flex;gap:8px;font-size:13.5px;line-height:1.5;margin-bottom:5px;}
  .note-line.wrong{color:var(--fail);}
  .note-line.correct{color:var(--pass);}
  .note-meta{font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;color:var(--muted);margin-top:8px;}

  .statbig{text-align:center;padding:10px 0 18px;}
  .statbig .num{font-size:44px;font-weight:900;font-family:"Noto Serif KR",serif;}
  .statbig .lbl{font-size:12.5px;color:var(--muted);font-family:"SFMono-Regular",Consolas,monospace;}

  .empty{
    text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;line-height:1.6;
  }

  textarea.memoinput{
    width:100%;min-height:90px;padding:12px 13px;
    border:1.5px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:14.5px;line-height:1.5;color:var(--ink);
    resize:vertical;margin-bottom:12px;
  }
  textarea.memoinput:focus{outline:none;border-color:var(--ink);}
  .memo-card{
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:14px;margin-bottom:12px;
  }
  .memo-card .memotext{font-size:14px;line-height:1.6;white-space:pre-wrap;margin:8px 0 10px;}
  .memo-card .memofoot{display:flex;justify-content:space-between;align-items:center;}
  .delbtn{
    background:none;border:none;color:var(--fail);font-size:12.5px;
    font-family:inherit;cursor:pointer;text-decoration:underline;padding:2px;
  }

  .syncbar{
    max-width:640px;margin:10px auto 0;display:flex;align-items:center;gap:10px;
    justify-content:space-between;
  }
  .syncstate{
    font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;color:var(--muted);
  }
  .syncstate.ok{color:var(--pass);}
  .syncstate.err{color:var(--fail);}
  .syncbtn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:600;
    font-family:inherit;cursor:pointer;white-space:nowrap;
  }
  .syncbtn:active{opacity:.8;}

  .footlink{
    display:block;text-align:center;margin-top:18px;
    font-size:12.5px;color:var(--muted);text-decoration:underline;
    background:none;border:none;font-family:inherit;cursor:pointer;width:100%;padding:8px;
  }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c2b39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TPAC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<header>
  <div class="row">
    <h1>TPAC 학습노트</h1>
    <span class="datebadge" id="dateBadge">2026.08.16</span>
  </div>
  <div class="subtitle">글로벌기준 · 국내제도 · 위험과 방법 · RA · CDD · CTR·STR</div>
  <div class="syncbar" id="syncBar">
    <span class="syncstate" id="syncState">로컬 저장 중</span>
    <button class="syncbtn" id="syncBtn" onclick="handleAuthClick()">구글 드라이브 연결</button>
  </div>
</header>

<nav class="tabs">
  <button class="tabbtn active" data-tab="quiz">모의고사</button>
  <button class="tabbtn" data-tab="notes">오답노트</button>
  <button class="tabbtn" data-tab="memo">핵심정리</button>
  <button class="tabbtn" data-tab="stats">통계</button>
</nav>

<div class="wrap">
<main>
  <div id="tab-quiz"></div>
  <div id="tab-notes" style="display:none;"></div>
  <div id="tab-memo" style="display:none;"></div>
  <div id="tab-stats" style="display:none;"></div>
</main>
</div>

<script>
/* ---------- 문제 은행 ---------- */
const BANK = [
{id:'G1',subject:'글로벌기준',q:'FATF(국제자금세탁방지기구)가 설립된 연도와 최초 설립 목적으로 옳은 것은?',ch:['1989년, 마약자금 방지','1995년, 테러자금 방지','2001년, 대량살상무기 확산 방지','1988년, 조세회피 방지','2005년, 가상자산 규제'],a:0,ex:'FATF는 1989년 마약자금 세탁을 방지할 목적으로 설립됐다. 이후 관할이 점차 확대됐다.'},
{id:'G2',subject:'글로벌기준',q:'자금세탁의 정의에 관한 국제법적 근거가 되는 협약 두 가지는?',ch:['바젤협약·비엔나협약','비엔나협약·팔레모협약','팔레모협약·메리다협약','바젤협약·메리다협약','비엔나협약·메리다협약'],a:1,ex:'비엔나협약(1988, 마약)과 팔레모협약(2000, 초국가조직범죄)이 자금세탁 정의의 국제법적 토대다.'},
{id:'G3',subject:'글로벌기준',q:'FATF의 관할이 확대되어 온 순서로 옳은 것은?',ch:['테러자금→마약→중대범죄→WMD','마약→중대범죄→테러자금→WMD','중대범죄→마약→WMD→테러자금','WMD→마약→테러자금→중대범죄','마약→테러자금→중대범죄→WMD'],a:1,ex:'마약(1989)→중대범죄(1996)→테러자금(2001)→대량살상무기확산(2012) 순으로 확대됐다.'},
{id:'G4',subject:'글로벌기준',q:'자금세탁의 일반적 3단계 진행 순서로 옳은 것은?',ch:['은폐→예치→통합','예치(배치)→은폐(반복)→통합(합법화)','통합→예치→은폐','배치→통합→은폐','은폐→통합→배치'],a:1,ex:'예치(Placement)→은폐(Layering)→통합(Integration) 순서가 표준 3단계 모델이다.'},
{id:'G5',subject:'글로벌기준',q:'다음 중 자금세탁의 특성으로 옳지 않은 것은?',ch:['국제범죄성','조직범죄성','화이트칼라형','개인범죄성','반복성'],a:3,ex:'자금세탁은 일반적으로 조직범죄성을 띠며, 개인범죄성은 해당 특성으로 보지 않는다.'},
{id:'G6',subject:'글로벌기준',q:'FATF 40개 권고사항 중 "법인의 실제소유자 확인"을 다루는 조항 번호는?',ch:['20번','24번','29번','16번','10번'],a:1,ex:'24번 권고사항이 법인·법률관계의 실제소유자(투명성) 관련 조항이다.'},
{id:'G7',subject:'글로벌기준',q:'FATF 40개 권고사항 중 "의심거래보고(STR)"를 다루는 조항 번호는?',ch:['16번','20번','24번','29번','35번'],a:1,ex:'20번 권고사항이 의심거래보고 의무를 규정한다.'},
{id:'G8',subject:'글로벌기준',q:'FATF 40개 권고사항 중 "금융정보분석원(FIU)"의 설치·역할을 다루는 조항 번호는?',ch:['10번','16번','20번','24번','29번'],a:4,ex:'29번 권고사항이 FIU 설립·기능에 관한 조항이다.'},
{id:'G9',subject:'글로벌기준',q:'FATF 국제기준상 금융회사의 거래기록·CDD 자료 보관 최소기간은?',ch:['3년','5년','7년','10년','기간 제한 없음'],a:1,ex:'FATF 권고는 거래기록·고객확인자료를 최소 5년간 보관하도록 요구한다.'},
{id:'G10',subject:'글로벌기준',q:'FATF 국제기준상 일회성 거래에 대한 CDD 적용 기준금액(현금거래 기준)은?',ch:['USD/EUR 5,000','USD/EUR 10,000','USD/EUR 15,000','USD/EUR 20,000','USD/EUR 30,000'],a:2,ex:'FATF 기준 일회성 거래는 미화(또는 유로화) 15,000 이상일 때 CDD를 적용한다.'},
{id:'G11',subject:'글로벌기준',q:'우리나라가 FATF 4차 라운드 상호평가를 받은 연도는?',ch:['2015년','2017년','2019년','2021년','2023년'],a:2,ex:'한국은 2019년 FATF 4차 라운드 상호평가를 받았다.'},
{id:'G12',subject:'글로벌기준',q:'EU 자금세탁방지지침(AMLD) 중 위험기반접근법(RBA)을 처음 도입한 차수는?',ch:['1차(1991)','2차(2001)','3차(2005)','4차(2015)','5차(2018)'],a:2,ex:'EU AMLD 3차(2005)에서 위험기반접근법(RBA)이 처음 도입됐다.'},

{id:'D1',subject:'국내제도',q:'우리나라 금융정보분석원(FIU)이 설립된 연도는?',ch:['1998년','2001년','2005년','2008년','2013년'],a:1,ex:'금융정보분석원(KoFIU)은 2001년에 설립됐다.'},
{id:'D2',subject:'국내제도',q:'금융정보분석원(FIU)의 정식 명칭은?',ch:['한국자금세탁방지원','금융정보분석원','금융감독정보원','자금세탁방지센터','금융보안분석원'],a:1,ex:'정식 명칭은 금융정보분석원(Korea Financial Intelligence Unit, KoFIU)이다.'},
{id:'D3',subject:'국내제도',q:'국내 STR·CTR 보고의무의 근거가 되는 법률의 정식 명칭은?',ch:['자금세탁방지법','특정 금융거래정보의 보고 및 이용 등에 관한 법률','범죄수익은닉의 규제 및 처벌 등에 관한 법률','금융실명거래 및 비밀보장에 관한 법률','전자금융거래법'],a:1,ex:'약칭 "특정금융정보법(특금법)"의 정식 명칭이다. "범죄수익은닉규제법"은 처벌·몰수를 다루는 별개 법률이다.'},
{id:'D4',subject:'국내제도',q:'자금세탁방지제도상 "전제범죄"는 몇 개 법률·몇 종으로 규정되어 있는가?',ch:['30개 법률 60종','54개 법률 116종','70개 법률 150종','20개 법률 40종','100개 법률 200종'],a:1,ex:'범죄수익은닉규제법 별표에 54개 법률 116종의 전제범죄가 규정되어 있다.'},
{id:'D5',subject:'국내제도',q:'특정금융정보법(특금법)과 범죄수익은닉규제법의 역할 구분으로 옳은 것은?',ch:['특금법=처벌·몰수, 범죄수익은닉규제법=보고·FIU','특금법=보고·FIU, 범죄수익은닉규제법=처벌·몰수','두 법률 모두 보고의무만 규정','두 법률 모두 처벌만 규정','특금법은 형사법, 범죄수익은닉규제법은 행정법'],a:1,ex:'특금법은 STR·CTR 등 보고체계와 FIU를, 범죄수익은닉규제법은 처벌·몰수를 규정한다.'},
{id:'D6',subject:'국내제도',q:'금융거래 시 타인 명의를 이용한 차명거래를 제재하는 근거 법률은?',ch:['특정금융정보법','범죄수익은닉규제법','금융실명거래 및 비밀보장에 관한 법률','전자금융거래법','자본시장법'],a:2,ex:'차명거래 제재는 금융실명법에 근거하며, 5년 이하 징역 또는 5천만원 이하 벌금에 처해질 수 있다.'},
{id:'D7',subject:'국내제도',q:'고객이 실제소유자 확인 등 고객확인(CDD)에 응하지 않을 경우, 금융회사가 취해야 할 조치로 옳은 것은?',ch:['정상 거래로 처리','신규거래 거절 및 기존거래 종료, STR 검토','수수료 할증 부과 후 거래 지속','상급기관 승인 시에만 거래 지속','계좌를 일시 정지만 하고 유지'],a:1,ex:'고객확인 거부 시 신규거래 거절, 필요 시 기존거래 종료, 아울러 STR 해당 여부를 검토해야 한다.'},
{id:'D8',subject:'국내제도',q:'다음 중 특정금융정보법(특금법)이 직접 규정하는 사항이 아닌 것은?',ch:['의심거래보고(STR)','고액현금거래보고(CTR)','고객확인의무(CDD)','금융정보분석원(FIU) 설치','범죄수익의 몰수·추징'],a:4,ex:'범죄수익의 몰수·추징은 범죄수익은닉규제법의 소관이다.'},
{id:'D9',subject:'국내제도',q:'다음 중 금융회사의 자금세탁방지(AML) 관련 제도가 아닌 것은?',ch:['고객확인제도(CDD)','의심거래보고(STR)','고액현금거래보고(CTR)','고객정보 삭제 의무','내부통제기준 수립'],a:3,ex:'"고객정보 삭제 의무"라는 AML 제도는 존재하지 않는다. 오히려 자료보관 의무(최소 5년)가 있다.'},
{id:'D10',subject:'국내제도',q:'의심거래보고(STR) 의무를 규정하고 있는 법률은?',ch:['금융실명법','특정금융정보법','범죄수익은닉규제법','전자금융거래법','신용정보법'],a:1,ex:'STR 보고의무는 특정금융정보법(특금법)에 규정되어 있다.'},
{id:'D11',subject:'국내제도',q:'금융회사 직원이 선의로 의심거래를 보고한 경우, 그 책임에 관한 설명으로 옳은 것은?',ch:['형사·민사상 책임을 진다','형사·민사상 책임이 면제된다','형사책임만 면제된다','민사책임만 면제된다','보고 내용에 따라 책임 여부가 달라진다'],a:1,ex:'선의로 STR을 보고한 경우 형사·민사상 책임이 면제된다. 다만 보고사실 누설 시에는 별도 제재 대상이다.'},
{id:'D12',subject:'국내제도',q:'법인 실제소유자 판별 1단계 기준으로 옳은 것은?',ch:['지분율 10% 이상 소유 자연인','지분율 25% 이상 소유 자연인','지분율 50% 이상 소유 자연인','대표이사 전원','최대주주 1인'],a:1,ex:'1단계는 지분율 25% 이상을 소유한 자연인을 실제소유자로 본다.'},
{id:'D13',subject:'국내제도',q:'실제소유자 판별 3단계 원칙의 순서로 옳은 것은?',ch:['대표자→사실상 지배자→25%이상 지분자','25%이상 지분자→사실상 지배자→대표이사','사실상 지배자→25%이상 지분자→대표이사','대표이사→25%이상 지분자→사실상 지배자','25%이상 지분자→대표이사→사실상 지배자'],a:1,ex:'1단계 25% 이상 지분 자연인 → 2단계 사실상 지배자 → 3단계 대표이사(고위경영진) 순으로 판별한다.'},
{id:'D14',subject:'국내제도',q:'실제소유자 확인이 면제될 수 있는 대상으로 옳지 않은 것은?',ch:['상장법인','국가·공공기관','금융회사','일반 비상장 영리법인','금융회사에 준하는 기관'],a:3,ex:'일반 비상장 영리법인은 면제 대상이 아니며 실제소유자 확인 절차를 거쳐야 한다.'},
{id:'D15',subject:'국내제도',q:'특정금융정보법(특금법) 위반 시 과태료 상한으로 옳은 것은?',ch:['1천만원','3천만원','5천만원','1억원','3억원'],a:3,ex:'특금법 제20조에 따라 위반 건당 최대 1억원의 과태료가 부과될 수 있다.'},
{id:'D16',subject:'국내제도',q:'사업자등록번호 중간번호(4~5번째 자리)가 "81"인 경우 일반적으로 어떤 유형에 해당하는가?',ch:['개인사업자(과세)','영리법인 본점','비영리법인 본·지점','국가·지방자치단체','외국법인 본·지점'],a:1,ex:'중간번호 81은 영리법인 본점을 나타낸다(참고용, 2차 확인 필요).'},
{id:'D17',subject:'국내제도',q:'사업자등록번호 중간번호가 "83"인 경우 면제 가능성이 높은 이유로 옳은 것은?',ch:['외국법인이기 때문','국가·지방자치단체·지자체조합에 해당하기 때문','상장법인이기 때문','금융회사이기 때문','비영리법인이기 때문'],a:1,ex:'중간번호 83은 국가·지방자치단체·지방자치단체조합을 나타내며 면제 가능성이 높으나 반드시 2차 확인이 필요하다.'},

{id:'R1',subject:'위험과 방법',q:'"스머핑(구조화, Structuring)"에 대한 설명으로 가장 적절한 것은?',ch:['거액을 한 번에 송금하는 기법','보고 기준금액을 회피하기 위해 거래를 소액으로 분할하는 기법','해외 여러 국가를 경유해 송금하는 기법','가상자산으로 자금을 전환하는 기법','대출을 이용해 자금출처를 위장하는 기법'],a:1,ex:'스머핑은 CTR 등 보고 기준금액을 피하려고 거래를 여러 건의 소액으로 쪼개는 대표적 자금세탁 기법이다.'},
{id:'R2',subject:'위험과 방법',q:'위장회사(Shell company)와 전위사업체(Front business)를 구분하는 핵심 기준은?',ch:['설립 국가','매출 규모','물리적 실체(실질 영업활동)의 유무','임직원 수','자본금 규모'],a:2,ex:'위장회사는 물리적 실체·실질 영업이 없는 반면, 전위사업체는 실제 영업을 하며 자금세탁 통로로도 쓰인다는 점에서 구분된다.'},
{id:'R3',subject:'위험과 방법',q:'FATF가 지정한 고위험 대응조치 국가(자금세탁방지 체계 미비)로 알려진 국가는?',ch:['중국, 러시아','이란, 북한','미국, 영국','일본, 싱가포르','베트남, 태국'],a:1,ex:'FATF는 이란·북한을 대응조치가 필요한 고위험국으로 지정해왔다.'},
{id:'R4',subject:'위험과 방법',q:'무역기반 자금세탁(TBML)의 대표적 수법으로 옳은 것은?',ch:['현금을 소액으로 분할 입금','수출입 송장(인보이스) 금액을 과대·과소 계상','가상자산 믹싱서비스 이용','차명계좌 다수 개설','보험상품 조기 해지'],a:1,ex:'TBML은 무역거래의 송장 금액을 조작(과대·과소 청구)해 가치를 이전하는 방식이 대표적이다.'},
{id:'R5',subject:'위험과 방법',q:'정치적 주요인물(PEP, Politically Exposed Person)에 대한 설명으로 옳은 것은?',ch:['모든 공무원을 의미한다','고위공직자 및 그 가족·측근을 포함하며 통상 EDD 대상이다','금융회사 임직원만을 의미한다','과거 이력과 무관하게 일반고객으로 취급된다','국내 거주자에게만 적용된다'],a:1,ex:'PEP는 고위공직자와 그 가족·측근을 포괄하며, 부패·자금세탁 위험이 높아 통상 강화된 고객확인(EDD) 대상이 된다.'},
{id:'R6',subject:'위험과 방법',q:'가상자산을 이용한 신종 자금세탁 수법으로 흔히 언급되는 것은?',ch:['수표 발행','환전소 창구 이용','믹싱(Mixing)·체인호핑(Chain-hopping)','신용장 개설','정기예금 가입'],a:2,ex:'믹싱서비스나 여러 코인을 바꿔가며 이동하는 체인호핑은 자금 추적을 어렵게 하는 신종 수법으로 지목된다.'},

{id:'RA1',subject:'위험평가',q:'자금세탁·테러자금조달 위험평가의 3요소로 옳은 것은?',ch:['위협·취약성·결과','위협·통제·비용','기회·수단·동기','규모·빈도·강도','발생가능성·심각성·긴급성'],a:0,ex:'위험은 위협(Threats)+취약성(Vulnerabilities)+결과(Consequences)의 조합으로 평가한다.'},
{id:'RA2',subject:'위험평가',q:'위험기반접근법(RBA, Risk-Based Approach)의 핵심 원칙으로 옳은 것은?',ch:['모든 고객에게 동일한 수준의 확인 절차 적용','고위험에는 자원을 집중하고 저위험은 절차를 간소화','저위험 고객은 확인을 생략','위험도 평가 없이 규모로만 판단','신규 고객만 위험평가 대상'],a:1,ex:'RBA는 고위험군에 자원과 통제를 집중하고, 저위험군은 절차를 간소화하는 것이 핵심이다.'},
{id:'RA3',subject:'위험평가',q:'금융회사가 위험평가를 새로 실시해야 하는 시점으로 가장 적절한 것은?',ch:['감독당국이 요구할 때만','정기적으로, 그리고 신상품·신규 채널 도입 등 중대한 변화가 있을 때','최초 영업 개시 시 1회만','고객 민원이 발생했을 때만','회계연도 종료 후 1회만'],a:1,ex:'위험평가는 정기적으로 실시하며, 신상품·신규 서비스·신규 채널 도입 등 위험에 영향을 줄 수 있는 변화가 있을 때도 재실시해야 한다.'},

{id:'C1',subject:'CDD',q:'고객확인제도(CDD)가 포괄하는 핵심 절차로 옳은 것은?',ch:['신원확인만 수행','신원확인 + 실제소유자 확인 + 거래목적 파악','거래목적 파악만 수행','실제소유자 확인만 수행','계좌 개설 승인 여부 결정만'],a:1,ex:'CDD는 고객 신원확인, 실제소유자 확인, 거래목적 파악을 포괄하는 절차다.'},
{id:'C2',subject:'CDD',q:'강화된 고객확인(EDD) 시 추가로 확인하는 항목이 아닌 것은?',ch:['직업','거래자금의 출처','거래목적','재산현황','가족관계증명서'],a:4,ex:'EDD 추가확인 항목은 직업·자금출처·거래목적·재산현황 등이며, 가족관계증명서는 통상적인 EDD 확인항목이 아니다.'},
{id:'C3',subject:'CDD',q:'간소화된 고객확인(SDD)을 적용할 수 없는 대상으로 옳은 것은?',ch:['상장법인','공공기관','FATF 비준수 국가의 국민','국내 금융회사','정부기관'],a:2,ex:'FATF 국제기준을 준수하지 않는 국가의 국민에게는 SDD를 적용할 수 없고 오히려 강화된 확인이 필요하다.'},
{id:'C4',subject:'CDD',q:'법인의 실제소유자에 대한 정의로 가장 적절한 것은?',ch:['등기부상 대표이사','최종적으로 지배지분을 보유한 자연인','최대 매출을 올리는 임원','법인 설립자','회계법인이 지정한 자'],a:1,ex:'실제소유자는 형식적 명의와 무관하게 최종적으로 지배지분을 보유한 자연인을 의미한다.'},
{id:'C5',subject:'CDD',q:'고객확인(CDD) 시 신원확인의 일반적 방법으로 옳은 것은?',ch:['구두 진술만으로 확인','실명확인증표(주민등록증 등)로 확인','거래금액으로 추정','고객의 자진신고서만으로 확인','타인의 확인으로 대체'],a:1,ex:'신원확인은 주민등록증 등 실명확인증표를 통해 이루어지는 것이 원칙이다.'},
{id:'C6',subject:'CDD',q:'다음 중 통상 고위험 고객군으로 분류되는 경우가 아닌 것은?',ch:['정치적 주요인물(PEP)','비거주 외국인','현금집중업종 종사자','급여이체용 신규 급여계좌 개설 근로자','고위험국가 거주 고객'],a:3,ex:'급여계좌 개설처럼 정형화된 저위험 거래는 통상 고위험군으로 분류되지 않는다.'},
{id:'C7',subject:'CDD',q:'CDD의 "계속고객확인(지속적 모니터링)"에 대한 설명으로 옳은 것은?',ch:['최초 거래 개시 시 1회만 수행하면 된다','거래관계가 지속되는 동안 정기적으로 정보를 재확인해야 한다','고객이 요청할 때만 수행한다','5년마다 1회만 수행한다','고위험 고객에게는 적용하지 않는다'],a:1,ex:'CDD는 최초 확인에 그치지 않고 거래관계 지속 중에도 정기적으로 정보를 재확인해야 한다.'},
{id:'C8',subject:'CDD',q:'고객확인 정보를 재이행(갱신)해야 하는 시점으로 가장 적절한 것은?',ch:['고객이 사망했을 때만','고객정보 변경을 인지했거나 위험도가 변경됐을 때','회계연도 종료 시에만','금리가 변동했을 때','상품이 만기됐을 때만'],a:1,ex:'기존 고객정보의 변경을 인지하거나 위험평가 결과 위험도가 변경된 경우 CDD를 재이행해야 한다.'},
{id:'C9',subject:'CDD',q:'강화된 고객확인(EDD)이 적용되는 사례로 가장 적절한 것은?',ch:['정기 급여이체 계좌','고위험국가에 거주하는 신규 고객','국내 상장법인과의 일반 거래','소액 정기적금 가입','공공요금 자동이체 등록'],a:1,ex:'고위험국가 거주 고객, PEP, 고액현금거래 고객 등은 EDD 적용 대상이다.'},

{id:'S1',subject:'CTR·STR',q:'고액현금거래보고(CTR)의 현행 기준금액으로 옳은 것은?',ch:['5백만원','1천만원','2천만원','3천만원','5천만원'],a:1,ex:'CTR 기준금액은 2019년 7월부터 1천만원(1거래일, 동일인, 동일 금융회사 합산)이다.'},
{id:'S2',subject:'CTR·STR',q:'CTR(고액현금거래보고) 기준금액이 현재의 1천만원으로 변경된 시행 시점은?',ch:['2013년 1월','2016년 1월','2019년 7월','2021년 1월','2023년 1월'],a:2,ex:'CTR 기준금액은 2019년 7월부터 1천만원으로 적용되고 있다.'},
{id:'S3',subject:'CTR·STR',q:'의심거래보고(STR)의 보고대상 거래 기준금액은?',ch:['1천만원 이상','2천만원 이상','5천만원 이상','1억원 이상','금액 기준 없음'],a:4,ex:'STR은 CTR과 달리 금액 기준이 없으며, 의심되는 합당한 근거가 있으면 금액과 무관하게 보고 대상이다.'},
{id:'S4',subject:'CTR·STR',q:'의심거래보고(STR)의 판단 기준으로 가장 적절한 것은?',ch:['거래금액이 1천만원을 초과하는지','금융회사 직원이 자금세탁 등에 이용되고 있다고 의심할 만한 합당한 근거가 있는지','고객이 외국인인지 여부','거래가 영업시간 외에 발생했는지','고객의 나이가 60세 이상인지'],a:1,ex:'STR은 금액과 무관하게, 자금세탁 등에 이용된다고 의심할 합당한 근거가 있을 때 보고한다.'},
{id:'S5',subject:'CTR·STR',q:'금융회사가 의심거래를 인지했을 때 취해야 할 조치로 가장 적절한 것은?',ch:['월말에 일괄 보고','지체없이 금융정보분석원(FIU)에 보고','고객에게 먼저 확인 후 보고 여부 결정','내부 결재만 받고 보고는 생략 가능','수사기관에 직접 신고'],a:1,ex:'의심거래를 인지한 경우 지체없이 FIU에 보고해야 한다.'},
{id:'S6',subject:'CTR·STR',q:'STR 보고 사실을 해당 고객 등에게 누설하는 행위(tipping-off)에 대한 설명으로 옳은 것은?',ch:['업무상 필요하면 자유롭게 알릴 수 있다','법령상 금지되며 위반 시 제재 대상이다','상급자 승인이 있으면 알릴 수 있다','보고 후 1년이 지나면 알려도 된다','고객이 요청하면 알려줘야 한다'],a:1,ex:'STR 보고사실 누설(tipping-off)은 법령상 금지되며 위반 시 제재를 받는다.'},
{id:'S7',subject:'CTR·STR',q:'CTR(고액현금거래보고) 제도가 적용되는 거래로 가장 적절한 것은?',ch:['계좌 간 온라인 이체','신용카드 결제','실제 현금(수표 제외)의 입금 또는 출금','펀드 환매','외화송금'],a:2,ex:'CTR은 실물 현금의 입금·출금 거래를 대상으로 하며, 계좌이체 등 비현금거래는 대상이 아니다.'},
{id:'S8',subject:'CTR·STR',q:'이상거래탐지시스템(FDS)의 주된 목적으로 옳은 것은?',ch:['고객 만족도 조사','정상적인 거래패턴에서 벗어난 거래를 탐지','대출 한도 산정','투자상품 추천','수수료 자동 정산'],a:1,ex:'FDS는 고객의 평소 거래패턴과 다른 이상징후를 자동으로 탐지해 STR 검토로 연결하는 시스템이다.'},
{id:'S9',subject:'CTR·STR',q:'CTR과 STR의 가장 근본적인 차이는 무엇인가?',ch:['보고 대상 기관이 다르다','CTR은 금액기준이 있고 STR은 금액기준이 없다','CTR은 임의보고, STR은 의무보고다','CTR은 해외거래만, STR은 국내거래만 대상이다','CTR은 법인만, STR은 개인만 대상이다'],a:1,ex:'CTR은 1천만원이라는 명확한 금액기준이 있는 반면, STR은 금액과 무관하게 의심 여부로 판단한다.'},
{id:'S10',subject:'CTR·STR',q:'금융회사가 의심거래보고(STR) 의무를 이행하지 않은 경우 받을 수 있는 조치는?',ch:['아무 조치도 없다','과태료 등 제재 대상이 될 수 있다','보고의무 자체가 면제된다','다음 분기로 보고를 이월할 수 있다','고객에게 책임이 전가된다'],a:1,ex:'STR 미보고는 특금법상 제재(과태료 등) 대상이 될 수 있다.'},
{id:'S11',subject:'CTR·STR',q:'고액현금거래보고(CTR) 제도의 주된 목적으로 옳은 것은?',ch:['금융회사의 수익 증대','고객 신용도 평가','자금흐름 추적을 위한 객관적 근거자료 확보','대출 심사 간소화','외환 환율 안정'],a:2,ex:'CTR은 일정 금액 이상의 현금거래 정보를 축적해 자금흐름을 추적할 객관적 근거자료를 확보하는 제도다.'},
{id:'S12',subject:'CTR·STR',q:'의심거래 여부를 판단할 때 종합적으로 고려해야 할 요소로 가장 거리가 먼 것은?',ch:['거래금액과 빈도','거래상대방의 특성','고객의 평소 거래패턴과의 괴리','고객의 정치적 성향(합법적 사상·신념)','자금의 출처와 목적'],a:3,ex:'의심거래 판단은 거래의 객관적 특성에 근거해야 하며, 합법적인 정치적 성향·사상 자체는 판단 요소가 아니다.'},
{id:'S13',subject:'CTR·STR',q:'영업점 직원이 의심거래 정황을 인지했을 때 취해야 할 절차로 가장 적절한 것은?',ch:['본인이 직접 FIU에 익명으로 신고','내부 보고체계(컴플라이언스 부서 등)를 통해 즉시 보고','고객과 상담 후 처리 여부 결정','상황을 기록만 해두고 다음 방문 시 재확인','거래를 임의로 거절만 하고 종료'],a:1,ex:'영업점 직원은 내부통제기준에 따른 보고체계를 통해 컴플라이언스 부서 등에 즉시 보고해야 한다.'},

{"id":"D20","subject":"국내제도","q":"우리나라 법령상 자금세탁의 개념을 규정하고 있는 법률의 조합으로 옳은 것은?","ch":["범죄수익은닉규제법·마약류불법거래방지법·특정금융정보법","특정금융정보법·금융실명법·상법","형법·특정금융정보법·자본시장법","범죄수익은닉규제법·형법·외국환거래법","특정금융정보법·신용정보법·전자금융거래법"],"a":0,"ex":"범죄수익은닉규제법 제3조(은닉·가장), 마약류불법거래방지법 제7조(불법수익 은닉), 특정금융정보법 제2조 제5호(조세포탈 목적 등) 세 법률이 자금세탁 개념을 규정한다."},
{"id":"D21","subject":"국내제도","q":"자금세탁방지 규제체계를 이루는 세 가지 축으로 옳은 것은?","ch":["예방·적발·처벌","금융제도·사법제도·국제협력체계","중앙정부·금융회사·고객","법률·시행령·감독규정","국내규제·해외규제·자율규제"],"a":1,"ex":"금융규제(고객확인·보고의무), 사법규제(처벌·몰수추징), 국제협력(정보교환·범죄인인도·사법공조)의 세 축으로 구성된다."},
{"id":"D22","subject":"국내제도","q":"가상자산 취급업소가 자금세탁방지 의무를 지는 \"가상자산사업자\"에 해당하기 위한 \"영업으로 한다\"의 판례상 요건이 아닌 것은?","ch":["영리를 목적으로 할 것","동종의 행위일 것","일정 규모 이상의 자본금을 갖출 것","계속적으로 할 것","반복적으로 할 것"],"a":2,"ex":"판례상 \"영업으로 한다\"는 ①영리 목적 ②동종의 행위를 ③계속적 ④반복적으로 하는 것을 의미하며, 자본금 요건은 판단기준이 아니다. (사례2)"},
{"id":"D23","subject":"국내제도","q":"투자일임업자가 증권사에 고객확인업무를 위탁하는 \"제3자를 통한 고객확인\"에 관한 설명으로 옳지 않은 것은?","ch":["업무규정 제52조에 따라 가능하다","제3자와 별도의 업무 위수탁 계약을 체결해야 한다","업무규정 제53조 소정의 요건을 충족해야 한다","위탁하면 고객확인 이행책임이 수탁자에게 이전된다","고객확인 이행의 최종책임은 위탁한 금융회사에 있다"],"a":3,"ex":"제3자를 통한 고객확인이 가능하더라도 최종책임은 업무를 위탁한 당해 금융회사(투자일임업자)에게 있다. (사례4)"},
{"id":"D24","subject":"국내제도","q":"부동산 신탁사의 자금세탁방지의무에 관한 FIU의 유권해석으로 옳은 것은?","ch":["여수신업무를 하지 않으므로 의무가 면제된다","타 금융기관이 수행하므로 업무 중복으로 제외된다","신탁계약 체결 시에만 의무가 있다","금융위 승인 시 면제 가능하다","여수신업무 수행 여부와 자금세탁방지업무 수행은 직접 관련이 없어 제외하기 어렵다"],"a":4,"ex":"여수신업무 수행 여부와 AML 업무 수행은 직접적 관련이 없으며, 부동산 신탁사도 고객의 자금세탁행위를 관찰할 수 있는 지위에 있어 제외하기 어렵다. (사례5)"},
{"id":"D25","subject":"국내제도","q":"자금세탁방지 내부통제체계 구축 항목 중 \"직원알기제도(Know Your Employee)\"에 대한 설명으로 옳은 것은?","ch":["임직원 채용 시(재직 중 포함) 그 신원사항을 확인하도록 하는 제도","고객의 신원사항을 확인하는 제도","임직원의 성과를 평가하는 제도","고객 응대 직원을 교육하는 제도","내부고발자를 보호하는 제도"],"a":0,"ex":"직원알기제도는 자금세탁 등에 자사 임직원이 이용되지 않도록 채용 시 및 재직 중 신원사항을 확인하는 제도다."},
{"id":"D26","subject":"국내제도","q":"자금세탁방지 내부통제상 \"독립적인 감사체계\"의 의미로 옳은 것은?","ch":["외부 회계법인의 감사를 받는 것","제3의 독립된 부서 등에서 관련 업무 수행의 적정성을 객관적으로 점검하는 체계","자금세탁방지 담당부서가 자체 점검하는 것","금융감독원의 검사를 받는 것","이사회가 직접 감사하는 것"],"a":1,"ex":"AML 업무 담당부서에 대해 제3의 독립된 부서 등이 업무 수행의 적정성을 객관적으로 점검하는 체계를 말한다."},
{"id":"D27","subject":"국내제도","q":"특정금융정보법상 \"금융회사등\"에 해당하지 않는 자는?","ch":["보험회사","카지노사업자","가상자산사업자","변호사·세무사","환전영업자"],"a":3,"ex":"현행법상 금융회사등에는 변호사나 세무사가 포함되어 있지 않아, 이들에게는 STR 보고의무가 없다. (사례8)"},
{"id":"D28","subject":"국내제도","q":"대부업자가 특정금융정보법상 금융회사등에 포함되기 위한 요건으로 옳은 것은?","ch":["모든 등록 대부업자","상장한 대부업자만","자산규모 기준 이상인 등록 대부업자","지자체 등록 대부업자만","대부중개업자만"],"a":2,"ex":"시행령상 대부업법 제3조 제2항 제5호에 따라 등록한 대부업자 중 같은 법 제9조의7 제1항에 따른 자산규모 이상인 자가 금융회사등에 포함된다."},
{"id":"S20","subject":"CTR·STR","q":"의심거래보고(STR)의 보고기한으로 옳은 것은?","ch":["거래일로부터 3영업일 이내","거래일로부터 30일 이내","보고대상으로 결정한 날로부터 30일 이내","보고대상으로 결정한 날로부터 3영업일 이내","즉시(당일)"],"a":3,"ex":"감독규정 제3조에 따라 \"의심되는 거래 보고대상 금융거래등\"으로 결정한 날로부터 3영업일 이내에 보고한다. 거래일 기준이 아님에 주의."},
{"id":"S21","subject":"CTR·STR","q":"금융회사가 긴급한 경우 STR을 전화·팩스로 보고했다면 이후 조치로 옳은 것은?","ch":["추가 조치 없이 종결된다","다음 분기에 일괄 보고한다","FIU가 직접 서면화한다","구두 확인만 받으면 된다","보고서식에 의해 문서·전자기록매체 또는 온라인으로 다시 보고해야 한다"],"a":4,"ex":"긴급보고 후에는 제6조·제11조의 보고서식에 따라 문서·전자기록매체 또는 온라인으로 다시 보고해야 한다(감독규정 제12조)."},
{"id":"S22","subject":"CTR·STR","q":"외국은행 국내지점이 본점·지역본부의 요청으로 STR 정보를 공유하는 것에 대한 FIU 해석으로 옳은 것은?","ch":["본점·지역본부는 동일 금융회사 내부로 간주되지 않아 공유할 수 없다","그룹 리스크 관리 목적이면 공유 가능하다","본점에만 공유 가능하다","금융위 승인 시 가능하다","고객 동의가 있으면 가능하다"],"a":0,"ex":"외국은행의 본점 및 지역본부는 특정금융정보법 제4조 제6항의 \"같은 금융회사등의 내부\"로 간주되지 않아 STR 정보를 공유할 수 없다. (사례7)"},
{"id":"S23","subject":"CTR·STR","q":"보험회사가 보험사기·보험증서 위변조 범죄사실을 인지해 수사기관에 신고했으나 보험금 지급 면책으로 회사에 금전적 손해가 없는 경우, STR 의무에 대한 설명으로 옳은 것은?","ch":["손해가 없으므로 보고의무가 없다","특정금융정보법 제4조 제1항 제3호에 해당하여 보고할 필요가 있다","면책되었으므로 보고의무가 없다","수사기관 신고로 갈음된다","금액이 1천만원 이상일 때만 보고한다"],"a":1,"ex":"회사 손해나 면책 여부와 무관하게, 범죄수익은닉규제법 제5조 제1항에 따라 수사기관에 신고한 경우이므로 특정금융정보법 제4조 제1항 제3호에 해당해 STR 보고가 필요하다. (사례9)"},
{"id":"S24","subject":"CTR·STR","q":"내부감사인이 독립적 감사 수행을 위해 STR 관련 정보를 열람하는 것에 대한 FIU 해석으로 옳은 것은?","ch":["내부감사인은 언제나 열람할 수 있다","이사회 승인 시 열람 가능하다","\"금융회사등의 내부에서 보고 사실을 제공하는 경우\"에 해당한다고 보기 어려운 경우 열람할 수 없다","감사 목적이면 예외 없이 허용된다","FIU 사전승인을 받으면 가능하다"],"a":2,"ex":"자금세탁행위 방지를 위한 내부 제공에 해당한다고 보기 어려운 경우 내부감사인은 STR 관련 정보를 열람할 수 없다. (사례10)"},
{"id":"S25","subject":"CTR·STR","q":"금융범죄를 이유로 거래 종료된 고객을 그룹 Global Exit List(GEL)에 등록하는 경우에 대한 설명으로 옳지 않은 것은?","ch":["법인명·설립일·법인등록번호 등 공개정보만 공유하면 위반이 아니다","의심거래 내용이나 보고 여부가 공유되면 위반 소지가 있다","GEL 등록대상이 의심거래 보고대상으로만 구성되면 보고여부가 추정될 수 있어 위반 소지가 있다","GEL 등록은 어떤 경우에도 특정금융정보법 위반이 아니다","GEL은 자금세탁 외 사기·뇌물·마약 등 다양한 금융범죄 유형을 포함한다"],"a":3,"ex":"공개정보만 공유하면 원칙적으로 위반이 아니나, 등록대상이 STR 보고대상으로만 구성되면 그 사실만으로 보고여부가 추정되어 위반 소지가 있다. (사례11)"},
{"id":"S26","subject":"CTR·STR","q":"STR 보고 시 고의 또는 중대한 과실로 거짓 보고를 한 경우가 아니라면, 금융회사가 지지 않는 책임은?","ch":["형사책임만","과태료","행정제재","모든 책임","손해배상책임"],"a":4,"ex":"특정금융정보법 제4조 제7항에 따라 고의·중과실 거짓보고가 아닌 한 거래 상대방 및 관계자에 대한 손해배상책임을 지지 않는다."},
{"id":"S27","subject":"CTR·STR","q":"고액현금거래보고(CTR)의 보고기한으로 옳은 것은?","ch":["3영업일 이내","7일 이내","15일 이내","30일 이내","다음 달 10일까지"],"a":3,"ex":"CTR은 현금등을 지급하거나 영수한 날로부터 30일 이내에 FIU에 보고한다. STR의 3영업일과 구분해 기억해야 한다."},
{"id":"S28","subject":"CTR·STR","q":"CTR 보고기한 30일의 말일이 토요일 또는 공휴일인 경우 보고기한은?","ch":["그 익일까지","그 말일까지","그 전 영업일까지","다시 30일 연장된다","기한의 제한이 없다"],"a":0,"ex":"민법 제155조·제161조에 따라 기간의 말일이 토요일 또는 공휴일이면 그 익일로 만료한다. (사례12)"},
{"id":"S29","subject":"CTR·STR","q":"CTR 기준금액 합산 시 제외되는 항목이 아닌 것은?","ch":["100만원 이하의 원화 송금 금액","100만원 이하에 상당하는 외국통화 매입·매각 금액","법원공탁금·정부보관금·송달료 지출 금액","은행지로장표에 의하여 수납한 금액","500만원의 현금 인출 금액"],"a":4,"ex":"현금 인출은 합산 대상이다. 제외 항목은 100만원 이하 원화송금, 100만원 이하 외국통화 매입·매각, 공과금 수납, 법원공탁금·정부법원보관금·송달료, 은행지로장표 수납액, 100만원 이하 선불카드 거래금액이다."},
{"id":"S30","subject":"CTR·STR","q":"CTR에서 \"동일인 명의\"의 의미로 옳은 것은?","ch":["같은 주소를 사용하는 자","금융실명법상 실지명의가 동일한 것","같은 계좌를 사용하는 자","같은 가족 구성원","같은 사업자등록번호를 쓰는 자"],"a":1,"ex":"시행령 제8조의2 제3항에 따라 동일인 명의란 금융실명법 제2조 제4호의 실지명의가 동일한 것을 말한다."},
{"id":"S31","subject":"CTR·STR","q":"카지노사업자가 고객으로부터 권면액 100만원 이하 수표 1,000만원과 현금 500만원을 받아 칩을 구입해 준 경우 CTR 의무는?","ch":["합산 1,500만원으로 보고대상이다","수표만 보고대상이다","수표는 합산 제외되어 현금 500만원만 고려되므로 보고대상이 아니다","금액과 무관하게 보고대상이다","카지노는 CTR 대상이 아니다"],"a":2,"ex":"권면액 100만원 이하 수표는 기준금액 산정 시 합산하지 않으므로 현금 500만원만 고려되어 보고대상이 아니다. (사례15①)"},
{"id":"S32","subject":"CTR·STR","q":"카지노사업자가 권면액 100만원 초과 수표를 지급·영수하면서 실지명의를 확인하고 수표번호를 기록·관리한 경우, CTR 기준금액 산정에 대한 설명으로 옳은 것은?","ch":["반드시 합산해야 한다","절반만 합산한다","FIU 승인 시에만 제외된다","실지명의 확인·기록관리 시 산입하지 않을 수 있다","현금으로 간주해 합산한다"],"a":3,"ex":"원칙적으로 권면액 100만원 초과 수표는 합산하나, 실지명의를 확인하고 실지명의·수표번호를 기록·관리하는 경우 산입하지 않을 수 있다(시행령 제8조의3 단서). (사례15②)"},
{"id":"S33","subject":"CTR·STR","q":"전자금융업자가 은행의 송금서비스를 이용해 1천만원 이상의 신용카드대금 정산금을 지급한 경우 CTR 의무는?","ch":["금액이 1천만원 이상이므로 보고해야 한다","은행과 공동으로 보고해야 한다","30일 이내 보고해야 한다","전자금융업자는 항상 보고 대상이다","금융거래 상대방에게 직접 현금등을 지급한 경우가 아니므로 보고하지 않아도 된다"],"a":4,"ex":"은행 송금서비스를 이용한 지급은 상대방에게 직접 현금등을 지급한 것이 아니므로 해당 전자금융업자는 CTR 보고 의무가 없다. (사례16)"},
{"id":"S34","subject":"CTR·STR","q":"부동산 신탁사가 위탁자에게 사업비를 현금으로 지급하는 경우 CTR에 관한 설명으로 옳은 것은?","ch":["1천만원 이상인 경우 보고대상에 해당한다","신탁사는 금융회사가 아니어서 대상이 아니다","금액과 무관하게 보고대상이다","위탁자 동의가 있으면 제외된다","분양대금 관련 거래는 모두 제외된다"],"a":0,"ex":"신탁업자는 금융회사등에 해당하며 현금 지급은 CTR 대상이나, 1천만원 이상인 경우에만 보고대상이 된다. (사례13)"},
{"id":"S35","subject":"CTR·STR","q":"CTR 보고 예외(제외) 사유에 해당하지 않는 것은?","ch":["다른 금융회사등과의 현금등 지급 또는 영수","국가·지방자치단체와의 현금등 지급 또는 영수","자금세탁 위험성이 없는 일상적인 현금등 지급 또는 영수","가상자산사업자와의 현금등 지급 또는 영수","대통령령으로 정하는 공공단체와의 거래"],"a":3,"ex":"가상자산사업자는 시행령 제8조의4에 의해 CTR 보고 예외에서 제외되므로, 가상자산사업자와의 거래는 보고대상이다."},
{"id":"S36","subject":"CTR·STR","q":"금융회사가 STR을 보고한 후 같은 상대방이 다시 의심거래를 하고 있다고 의심되는 경우 조치로 옳은 것은?","ch":["이미 보고했으므로 추가 보고는 불필요하다","다시 금융정보분석원장에게 보고해야 한다","분기별로 모아서 보고한다","거래를 즉시 종료하면 보고를 갈음한다","FIU가 요청할 때만 보고한다"],"a":1,"ex":"감독규정 제4조 제2항에 따라 기 보고 후에도 동일 상대방의 의심거래가 다시 인지되면 이를 다시 보고해야 한다."},

{"id":"C37","subject":"CDD","q":"타행계좌를 결제수단으로 오픈뱅킹 API를 통해 당행 간편결제서비스를 이용하는 고객에 대한 고객확인 의무는?","ch":["타행이 이미 확인했으므로 생략 가능하다","금액이 1천만원 이상일 때만 확인한다","단순 플랫폼 제공이므로 불필요하다","오픈뱅킹은 고객확인 대상이 아니다","본인이 개설한 간편결제 서비스를 이용하는 고객이라면 고객확인의무를 이행해야 한다"],"a":4,"ex":"계좌 개설 은행과 다른 금융회사가 새로운 상품·서비스를 제공하는 경우이므로 별도의 고객확인의무를 이행해야 한다. (사례30①)"},

{"id":"C39","subject":"CDD","q":"고객확인 검증 시 고객이 제시한 정보와 금융회사 보유 정보 간에 차이가 있는 경우 조치로 옳은 것은?","ch":["고객 진술을 우선한다","차이를 확인하여 기록·관리해야 한다","금융회사 정보를 우선한다","거래를 즉시 거절한다","FIU에 즉시 보고한다"],"a":1,"ex":"검증 시 고객 제시 정보와 기존 보유 정보 간 차이가 있으면 그 차이를 확인하여 기록·관리해야 한다. (사례17)"},
{"id":"C40","subject":"CDD","q":"고객이 소액해외송금업자를 통해 외화를 송금하는 경우 거래의 성격으로 옳은 것은?","ch":["계좌의 신규 개설","계속적 거래","일회성 금융거래","고객확인 면제 거래","금융거래가 아님"],"a":2,"ex":"계약관계가 없는 소액해외송금업자를 통한 외화송금은 일회성 금융거래에 해당한다(업무규정 제23조 제1항 제1호). (사례23)"},
{"id":"C41","subject":"CDD","q":"국가위험 평가 시 활용할 수 있는 공신력 있는 자료가 아닌 것은?","ch":["FATF가 발표하는 권고기준 이행 취약국가 리스트","UN 등 국제기구가 발표하는 제재 관련 국가 리스트","국제투명성기구가 발표하는 부패 관련 국가 리스트","금융회사 임직원의 주관적 인상","FATF 고위험 및 모니터링 대상 국가 목록"],"a":3,"ex":"국가위험은 FATF·UN·국제투명성기구 등 공신력 있는 기관의 자료를 활용해 평가한다. 주관적 인상은 평가 근거가 될 수 없다. (사례18)"},
{"id":"C42","subject":"CDD","q":"강화된 고객확인(EDD)이 요구되는 법정 요건으로 옳은 것은?","ch":["거래금액이 1천만원 이상인 경우","고객이 외국인인 경우","신규 계좌 개설인 경우","고객이 실제 소유자인지 여부가 의심되는 등 자금세탁행위나 공중협박자금조달행위를 할 우려가 있는 경우","고객이 현금거래를 하는 경우"],"a":3,"ex":"특정금융정보법 제5조의2 제1항 제2호에 따라 실제 소유자 여부가 의심되는 등 우려가 있는 경우 기본 확인사항 외에 거래목적과 자금원천을 추가 확인한다."},
{"id":"C43","subject":"CDD","q":"금융회사가 EDD에서 확인해야 할 추가사항의 범위에 대한 법령상 한정으로 옳은 것은?","ch":["제한 없이 모든 정보를 요구할 수 있다","고객이 동의하는 범위에 한정된다","금융회사 내규가 정하는 범위에 한정된다","FIU가 사전 승인한 범위에 한정된다","자금세탁·공중협박자금조달행위의 위험성에 비례하여 합리적으로 가능하다고 판단하는 범위에 한정된다"],"a":4,"ex":"특정금융정보법 제5조의2 제1항 제2호 나목은 위험성에 비례하여 합리적으로 가능하다고 판단하는 범위로 한정한다."},
{"id":"C44","subject":"CDD","q":"보험회사가 국내법령 요구 수준보다 강화된 정보를 요구하며 미이행 시 보험계약 거래(중도인출·추가납입·해지 등)를 제약하는 것에 대한 FIU 해석으로 옳은 것은?","ch":["위험성과 비례성이 없거나 합리적이지 않은 과도한 요구로 계약자 권리를 축소하는 것은 신중해야 한다","자유롭게 제약할 수 있다","어떠한 경우에도 제약할 수 없다","약관에 없으면 무조건 가능하다","금융위 승인만 있으면 제한 없이 가능하다"],"a":0,"ex":"보험업법 제128조의3(기초서류 작성·변경 원칙)의 취지상, 위험성과 비례성 없는 과도한 정보 요구로 계약자 권리를 축소하는 내용을 기초서류에 포함하는 것은 신중해야 한다. (사례24)"},
{"id":"C45","subject":"CDD","q":"고객확인을 할 수 없는 경우 금융회사의 조치 순서로 옳은 것은?","ch":["거래 종료 → 신규거래 거절 → FIU 신고","신규거래 거절 및 기존거래 종료 → 의심거래보고 여부 검토","즉시 FIU 보고 → 거래 유지","고객 동의 확보 → 거래 지속","수수료 부과 → 거래 지속"],"a":1,"ex":"특정금융정보법 제5조의2 제4항·제5항에 따라 신규거래를 거절하고 기존거래를 종료한 후, 제4조에 따른 의심거래보고 여부를 검토해야 한다."},
{"id":"C46","subject":"CDD","q":"고객확인제도(CDD)에서 확인하는 사항에 포함되지 않는 것은?","ch":["고객의 신원","실제 소유자","거래의 목적","자금의 원천","고객의 신용등급"],"a":4,"ex":"CDD는 고객 신원 확인·검증, 실제 소유자, 거래목적, 자금원천을 확인하는 제도이며 신용등급 평가는 포함되지 않는다."},
{"id":"C47","subject":"CDD","q":"고객확인을 한 사항이 의심스러운 경우 금융회사의 조치로 옳은 것은?","ch":["고객 진술만으로 갈음한다","즉시 거래를 종료한다","출처를 신뢰할 만한 문서·정보 등 확인자료를 이용해 진위 여부를 확인해야 한다","FIU에 판단을 의뢰한다","다음 거래 시까지 유보한다"],"a":2,"ex":"시행령 제10조의2 제3항에 따라 출처를 신뢰할 만한 문서·정보 그 밖의 확인자료로 진위 여부를 확인하고, 확인자료·확인방법을 업무지침에 반영해 운용해야 한다."},
{"id":"R20","subject":"위험과 방법","q":"자금세탁 3단계 중 \"배치(placement)\" 단계에 대한 설명으로 옳은 것은?","ch":["금융거래를 반복해 자금추적을 불가능하게 만드는 단계","불법자금을 정상적인 경제활동에 재투입하는 단계","범죄수익을 몰수·추징하는 단계","불법재산을 취급하기 쉽고 덜 의심스러운 형태로 변형하기 위해 금융회사로 유입시키거나 국외로 이송하는 단계","자금을 해외 조세피난처로 옮기는 단계"],"a":3,"ex":"배치 단계는 불법재산을 금융회사로 유입시키거나 물리적으로 국외로 이송하는 최초 단계다."},
{"id":"R21","subject":"위험과 방법","q":"자금세탁 3단계 중 \"통합(integration)\" 단계의 설명으로 옳은 것은?","ch":["불법재산을 금융회사에 최초 유입시킨다","각종 금융거래를 반복해 출처를 감춘다","현금을 소액으로 분할한다","해외로 물리적 이송한다","자금출처 추적이 불가능해진 불법자금을 정상적 경제활동에 재투입한다"],"a":4,"ex":"통합 단계에서는 충분한 반복을 거쳐 추적이 불가능해진 자금을 법인 예금계좌 입금, 부동산 구입·매각 등으로 합법자금화한다."},
{"id":"R22","subject":"위험과 방법","q":"\"자금세탁(Money Laundering)\"이라는 용어의 유래로 알려진 것은?","ch":["1920년대 미국 조직범죄자들이 불법수입을 세탁소의 합법적 수입으로 가장한 것","1970년대 스위스 비밀계좌 사건","1980년대 마약 카르텔의 은행 이용","1990년대 유럽 조세피난처 활용","2000년대 온라인 도박 자금 이동"],"a":0,"ex":"1920년대 알 카포네 등 조직범죄자들이 도박·불법주류 수입금을 현금거래가 많은 이탈리아인 세탁소의 합법 수입으로 가장한 데서 유래했다."},
{"id":"R23","subject":"위험과 방법","q":"공중협박자금조달행위에 해당하지 않는 것은?","ch":["공중협박행위를 하려는 자를 이롭게 할 목적으로 자금을 제공하는 행위","그러한 목적으로 자금을 모집하는 행위","그러한 자금을 운반·보관하는 행위","그러한 제공·모집을 강요하거나 권유하는 행위","일반적인 국제 구호단체에 대한 정상적 기부행위"],"a":4,"ex":"정상적 기부는 해당하지 않는다. 공중협박행위자를 이롭게 할 목적의 제공·모집·운반·보관 및 그 강요·권유가 해당한다."},
{"id":"RA10","subject":"위험평가","q":"금융회사가 구축해야 할 자금세탁방지 체계 중 \"위험기반 자금세탁방지 절차수립\"에 포함되지 않는 것은?","ch":["위험평가 절차 수립","위험기반 고객확인의무 절차 수립","위험기반 계좌 및 거래 모니터링 절차 수립","요주의 리스트 필터링 시스템 구축","신규 금융상품 수익성 분석 절차 수립"],"a":4,"ex":"수익성 분석은 AML 체계 요소가 아니다. 요주의 리스트 필터링은 모니터링 시스템 구축 항목에 속한다."},
{"id":"RA11","subject":"위험평가","q":"금융회사가 신규 금융상품 및 서비스를 제공하기 전에 수행해야 하는 절차로 옳은 것은?","ch":["수익성 검토","위험평가절차 수립","고객 만족도 조사","경쟁사 비교분석","금융위 사전승인"],"a":1,"ex":"자금세탁방지 내부통제 구축 항목에 \"신규 금융상품 및 서비스 제공 전 위험평가절차 수립\"이 포함된다."},
{"id":"RA12","subject":"위험평가","q":"고객위험(고객유형 위험) 평가에 활용되는 요소로 가장 거리가 먼 것은?","ch":["업종","직업","거래유형","거래빈도","금융회사의 자본금 규모"],"a":4,"ex":"고객위험은 업종·직업·거래유형·거래빈도 등 고객 특성으로 평가한다. 금융회사 자본금은 고객위험 요소가 아니다. (사례18)"},

{id:'NG05',subject:EXTS.G,t:'basic',p:10,
q:'FATF 상호평가(Mutual Evaluation)의 두 가지 평가 축으로 옳은 것은?',
ch:['기술적 이행 평가와 효과성 평가','서면 평가와 현지 평가','자체 평가와 동료 평가','정량 평가와 정성 평가','사전 평가와 사후 평가'],a:0,
ex:'4차 라운드 상호평가는 40개 권고사항의 법제화 수준을 보는 기술적 이행(Technical Compliance) 평가와, 11개 즉시성과(IO)로 실제 작동 여부를 보는 효과성(Effectiveness) 평가로 구성된다.'},

{id:'NG06',subject:EXTS.G,t:'basic',p:5,
q:'FATF 상호평가의 기술적 이행 평가 등급 4단계를 높은 순서대로 옳게 나열한 것은?',
ch:['C - LC - PC - NC','High - Substantial - Moderate - Low','A - B - C - D','우수 - 양호 - 보통 - 미흡','C - PC - LC - NC'],a:0,
ex:'기술적 이행은 이행(C) - 대부분이행(LC) - 부분이행(PC) - 미이행(NC) 4단계다. High/Substantial/Moderate/Low는 효과성(IO) 평가 등급이므로 혼동하지 않아야 한다.'},

{id:'NG07',subject:EXTS.G,t:'basic',p:10,
q:'FATF 권고사항 중 정밀금융제재(TFS)를 규정한 권고 6과 권고 7의 대상을 옳게 짝지은 것은?',
ch:['권고 6: 테러 및 테러자금조달 / 권고 7: 대량살상무기 확산금융','권고 6: 대량살상무기 확산금융 / 권고 7: 테러자금조달','권고 6: 마약범죄 / 권고 7: 부패범죄','권고 6: 비영리조직 / 권고 7: 테러자금조달','권고 6: 국제제재 / 권고 7: 자산동결'],a:0,
ex:'권고 6은 테러·테러자금조달 관련 정밀금융제재, 권고 7은 확산금융(WMD) 관련 정밀금융제재다. 두 권고 모두 지체 없이(without delay) 자산동결을 요구한다.'},

{id:'NG08',subject:EXTS.G,t:'combo',p:10,
q:'FATF 권고 21(정보누설 금지 및 면책)에 관한 설명 중 옳은 것을 모두 고른 것은?\n\nA. 금융기관과 그 임직원은 STR 보고 사실을 고객에게 알려서는 안 된다.\nB. 선의로 STR을 보고한 경우 계약상·법률상 비밀유지 의무 위반 책임을 면제한다.\nC. 정보누설 금지는 고객뿐 아니라 제3자에 대한 누설도 포함한다.\nD. 면책은 보고 내용이 사후에 사실이 아닌 것으로 밝혀지면 소급하여 취소된다.',
ch:['A, B','A, B, C','B, C, D','A, C, D','A, B, C, D'],a:1,
ex:'A·B·C가 옳다. D가 틀렸다 — 선의(good faith)로 보고했다면 결과적으로 범죄와 무관한 것으로 밝혀져도 면책은 유지된다. 결과책임을 지우면 보고 위축이 발생하기 때문이다.'},

{id:'NG09',subject:EXTS.G,t:'basic',p:5,
q:'FATF 권고사항 중 비영리조직(NPO)의 테러자금조달 악용 방지를 다루는 권고 번호는?',
ch:['권고 5','권고 8','권고 12','권고 22','권고 25'],a:1,
ex:'권고 8이 비영리조직(NPO) 관련 조항이다. 권고 5는 테러자금조달의 범죄화, 권고 25는 신탁 등 법률관계의 실제소유자 투명성.'},

{id:'NG10',subject:EXTS.G,t:'count',p:15,
q:'다음 FATF 권고사항 번호와 주제의 연결 중 옳지 않은 것은 모두 몇 개인가?\n\nA. 권고 13 — 환거래은행(Correspondent Banking)\nB. 권고 14 — 자금·가치이전서비스(MVTS)\nC. 권고 15 — 신기술\nD. 권고 17 — 전신송금\nE. 권고 18 — 내부통제 및 해외 지점·자회사',
ch:['0개','1개','2개','3개','4개'],a:1,
ex:'D 하나만 틀렸다. 전신송금은 권고 16이고, 권고 17은 제3자 의존(Reliance on Third Parties)이다. 문제가 옳지 않은 것의 개수를 묻고 있으므로 답은 1개다.'},

{id:'NG11',subject:EXTS.G,t:'basic',p:5,
q:'FATF 권고사항 중 현금 및 무기명 지급수단의 국경 간 휴대 반출입 통제를 규정한 권고 번호는?',
ch:['권고 30','권고 31','권고 32','권고 33','권고 34'],a:2,
ex:'권고 32가 현금휴대반출입(Cash Couriers) 조항이다. 권고 30·31은 법집행·조사기관의 책임과 권한, 권고 33은 통계.'},

{id:'NG12',subject:EXTS.G,t:'basic',p:10,
q:'볼프스베르그 그룹(Wolfsberg Group)에 관한 설명으로 옳은 것은?',
ch:['각국 FIU가 참여하는 정부간 정보교환 협의체이다','세계 주요 국제은행들이 자율적으로 구성한 민간 협의체로 프라이빗뱅킹·환거래은행 등에 관한 AML 원칙을 제정한다','FATF 산하 지역기구로 아시아·태평양 지역을 담당한다','국제결제은행 산하에서 은행 자기자본 규제를 담당한다','유엔 산하 마약·범죄 대응 기구이다'],a:1,
ex:'볼프스베르그 그룹은 민간 국제은행들의 자율 협의체로, 법적 구속력은 없으나 프라이빗뱅킹 AML 원칙·환거래은행 실사 질의서(CBDDQ) 등 사실상의 국제 실무기준을 제시한다. 3번은 APG, 4번은 BCBS, 5번은 UNODC.'},

{id:'NG13',subject:EXTS.G,t:'basic',p:10,
q:'바젤은행감독위원회(BCBS)의 AML 관련 역할로 옳은 것은?',
ch:['각국 FIU의 의심거래정보를 직접 수집·분석한다','국제결제은행(BIS) 산하 은행감독 기준 제정 기구로서 은행의 자금세탁·테러자금조달 리스크의 건전한 관리 지침을 제시한다','FATF 권고사항 미이행국에 대해 직접 제재를 부과한다','국제 자금세탁 범죄를 수사·기소한다','가상자산사업자 신고 수리 업무를 담당한다'],a:1,
ex:'BCBS는 BIS 산하 은행감독 기준 제정 기구다. 고객확인(KYC) 관련 지침을 일찍부터 제시해 왔으며 FATF 기준과 상호 보완 관계에 있다. 다만 제재 권한이나 수사 권한은 없다.'},

{id:'NG14',subject:EXTS.G,t:'blank',p:10,
q:'다음 빈칸에 들어갈 협약명으로 옳은 것은?\n\n자금세탁의 범죄화를 최초로 국제적으로 규정한 것은 마약범죄를 대상으로 한 ( A )이며, 자금세탁의 전제범죄를 중대범죄 전반으로 확대한 것은 ( B )이다. 한편 부패범죄 대응을 위한 국제협약은 ( C )이다.',
ch:['A: 비엔나협약 / B: 팔레모협약 / C: 메리다협약','A: 팔레모협약 / B: 비엔나협약 / C: 메리다협약','A: 비엔나협약 / B: 메리다협약 / C: 팔레모협약','A: 메리다협약 / B: 팔레모협약 / C: 비엔나협약','A: 바젤협약 / B: 비엔나협약 / C: 팔레모협약'],a:0,
ex:'비엔나협약(1988, 마약) → 팔레모협약(2000, 초국가조직범죄) → 메리다협약(2003, 부패방지) 순이다. 연도와 대상 범죄를 함께 묶어 외워야 혼동을 피한다.'},

{id:'NG15',subject:EXTS.G,t:'basic',p:10,
q:'FATF가 발표하는 고위험국가 관련 두 가지 성명서 체계에 대한 설명으로 옳은 것은?',
ch:['대응조치를 요하는 고위험국가와 강화된 관찰대상국 두 가지로 구분된다','블랙리스트 하나만 존재한다','회원국·비회원국으로만 구분한다','제재국·비제재국으로 구분한다','평가등급 C·NC 국가로 구분한다'],a:0,
ex:'통상 블랙리스트로 불리는 대응조치 요구 대상 국가와, 그레이리스트로 불리는 강화된 관찰대상국(Jurisdictions under Increased Monitoring) 두 가지 체계다. 대응조치 대상국에 대해서는 대응조치 적용이 요구되고, 관찰대상국은 강화된 고객확인 등 위험 반영이 요구된다.'},

{id:'NG16',subject:EXTS.G,t:'basic',p:10,
q:'FATF 권고 1(위험기반접근법)에 관한 설명으로 옳지 않은 것은?',
ch:['국가는 자금세탁·테러자금조달 위험을 확인·평가하여야 한다','위험이 높은 분야에는 강화된 조치를 적용한다','위험이 낮은 것으로 확인된 분야에는 간소화된 조치를 허용할 수 있다','위험평가 결과는 문서화하고 최신 상태로 유지하여야 한다','위험이 낮게 평가되면 고객 신원확인 자체를 생략할 수 있다'],a:4,
ex:'간소화된 고객확인은 일부 절차의 완화일 뿐 신원확인 자체를 면제하는 것이 아니다. 또한 자금세탁이 의심되거나 위험이 높게 평가되는 경우에는 간소화 자체를 적용할 수 없다.'},

{id:'NG17',subject:EXTS.G,t:'basic',p:5,
q:'FATF 권고사항 중 기타 형태의 국제협력(Other Forms of International Cooperation)을 규정한 권고 번호는?',
ch:['권고 36','권고 37','권고 38','권고 39','권고 40'],a:4,
ex:'권고 40이 기타 형태의 국제협력이다. 권고 36은 국제협약 이행, 37은 사법공조, 38은 사법공조를 통한 동결·몰수, 39는 범죄인 인도.'},

{id:'NG18',subject:EXTS.G,t:'case',p:15,
q:'[사례] A국은 FATF 4차 라운드 상호평가에서 권고 24(법인의 실제소유자)에 대해 기술적 이행 PC 등급을, 즉시성과 IO.5(법인·법률관계의 남용 방지)에 대해 Moderate 등급을 받았다. A국은 후속조치 절차에 들어갔다.\n\n이 상황에 대한 해석으로 가장 적절한 것은?',
ch:['기술적 이행과 효과성이 모두 최하위 등급이므로 즉시 대응조치 대상국이 된다','법령은 일부만 갖춰졌고 실제 작동 수준도 중간에 그친다는 의미로, 실제소유자 정보의 정확성·적시성 확보가 개선 과제가 된다','기술적 이행 PC는 법령이 전혀 없다는 뜻이다','효과성 Moderate는 효과성 평가 중 최고 등급이므로 문제가 없다','상호평가 결과는 권고적 성격이어서 후속조치 절차가 존재하지 않는다'],a:1,
ex:'PC(부분이행)는 법령이 일부 갖춰진 상태이지 전무한 것이 아니며(NC가 미이행), Moderate는 효과성 4단계 중 3번째다. 대응조치 대상국 지정은 별도 절차이며 상호평가 등급만으로 자동 지정되지 않는다. FATF는 등급에 따라 정기·강화 후속조치 절차를 운영한다.'},

/* ================= 국내제도 (18) ================= */

{id:'NK01',subject:EXTS.K,t:'blank',p:10,
q:'다음 빈칸에 들어갈 조문으로 옳은 것은?\n\n자금세탁방지 및 공중협박자금조달금지에 관한 업무규정상 직원알기제도의 정의는 ( A )에, 독립적 감사를 연 1회 이상 실시하도록 한 주기 규정은 ( B )에 두고 있다.',
ch:['A: 제6조 / B: 제12조','A: 제10조 / B: 제14조','A: 제12조 / B: 제16조','A: 제10조 / B: 제12조','A: 제14조 / B: 제10조'],a:1,
ex:'업무규정 제10조가 직원알기제도의 정의, 제14조가 독립적 감사의 주기(연 1회 이상, 영업점은 별도 주기 가능)를 규정한다. 제12조는 독립적 감사체계의 정의, 제16조는 결과보고.'},

{id:'NK02',subject:EXTS.K,t:'basic',p:10,
q:'업무규정상 독립적 감사의 실시 주체에 관한 설명으로 옳지 않은 것은?',
ch:['원칙적으로 감사 또는 감사위원회가 실시한다','감사 실시자가 관련 전문성을 갖추도록 적절한 조치를 취해야 한다','감사부서 외의 내부부서로 하여금 실시하게 할 수 있다','외부전문가로 하여금 실시하게 할 수 있다','자금세탁방지 업무를 담당하는 부서가 실시할 수 있다'],a:4,
ex:'자금세탁방지 업무 담당부서는 피감 대상이므로 독립적 감사의 주체가 될 수 없다. 감사 또는 감사위원회가 실시하기 어려운 경우에도 감사부서 외의 내부부서에서 AML 담당부서는 명시적으로 제외된다.'},

{id:'NK03',subject:EXTS.K,t:'basic',p:10,
q:'업무규정상 독립적 감사 실시 후 그 결과를 보고해야 하는 대상으로 옳은 것은?',
ch:['금융정보분석원장','이사회','대표이사','준법감시인','금융감독원장'],a:1,
ex:'감사 또는 감사위원회는 감사 실시 후 그 결과를 이사회에 보고하고, 감사범위·내용·위반사항·사후조치 등을 기록·관리해야 한다. FIU 보고 사항이 아니다.'},

{id:'NK04',subject:EXTS.K,t:'count',p:15,
q:'현행 업무규정(FIU고시 제2025-2호)상 구성원별 역할과 책임에 관한 설명이다. 옳은 것은 모두 몇 개인가?\n\nA. 이사회는 업무지침의 제정·개정 및 폐지에 관한 역할과 책임을 진다.\nB. 대표이사는 자금세탁방지등을 위한 내부통제체계를 총괄적으로 구축·운영한다.\nC. 보고책임자의 임명은 이사회가 직접 한다.\nD. 준법감시인등은 임직원의 업무지침 준수 여부를 감독한다.\nE. 보고책임자는 직원알기제도의 수립 및 운영을 담당한다.',
ch:['1개','2개','3개','4개','5개'],a:3,
ex:'A·B·D·E 4개가 옳다. C가 틀렸다 — 보고책임자의 임명은 대표이사의 역할이다. 현행 고시는 종전의 경영진 조문을 대표이사(제5조)로 개편하고 준법감시인등(제5조의2)을 신설했으므로, 구 규정 기준으로 암기하면 오답이 된다.'},

{id:'NK05',subject:EXTS.K,t:'basic',p:10,
q:'자금세탁방지 내부통제의 3선 방어체계(Three Lines of Defence)에 대한 설명으로 옳은 것은?',
ch:['1선 내부감사 - 2선 영업점 - 3선 준법감시','1선 영업·현업 부서 - 2선 준법감시·리스크관리 - 3선 내부감사','1선 준법감시 - 2선 내부감사 - 3선 영업점','1선 이사회 - 2선 대표이사 - 3선 보고책임자','1선 금융회사 - 2선 감독기관 - 3선 FATF'],a:1,
ex:'고객을 직접 대면하며 위험을 1차로 식별·통제하는 영업·현업이 1선, 정책 수립과 모니터링을 담당하는 준법감시·리스크관리가 2선, 1·2선의 적정성을 독립적으로 검증하는 내부감사가 3선이다.'},

{id:'NK06',subject:EXTS.K,t:'combo',p:10,
q:'3선 방어체계에 관한 설명 중 옳은 것을 모두 고른 것은?\n\nA. 1선은 고객확인 이행과 의심거래 인지·보고의 최일선 책임을 진다.\nB. 2선은 AML 정책·절차를 수립하고 이행 상황을 모니터링한다.\nC. 3선은 1선과 2선의 통제 적정성을 독립적으로 검증한다.\nD. 3선의 독립성 확보를 위해 감사부서장이 보고책임자를 겸임하는 것이 바람직하다.',
ch:['A, B','A, B, C','B, C, D','A, C, D','A, B, C, D'],a:1,
ex:'A·B·C가 옳다. D는 정반대다 — 감사팀장이 보고책임자를 겸임하면 자신이 수행한 업무를 자신이 감사하게 되어 독립적 감사체계를 구축한 것으로 볼 수 없다(FIU 유권해석 사례 92).'},

{id:'NK07',subject:EXTS.K,t:'basic',p:10,
q:'업무규정상 보고책임자의 역할 및 책임에 해당하지 않는 것은?',
ch:['의심되는 거래 및 고액현금거래의 금융정보분석원장 보고','고객확인 이행 관련 업무 총괄','직원알기제도의 수립 및 운영','임직원에 대한 교육 및 연수','업무지침 제정·개정·폐지 안건의 이사회 상정'],a:4,
ex:'업무지침 제정·개정·폐지 안건의 이사회 상정은 대표이사의 역할이며, 그 제정·개정·폐지 자체에 관한 권한과 책임은 이사회에 있다. 나머지는 보고책임자의 역할이다.'},

{id:'NK08',subject:EXTS.K,t:'basic',p:5,
q:'업무규정상 자금세탁방지 교육 및 연수의 실시 주기와 실시 주체로 옳은 것은?',
ch:['보고책임자가 연 1회 이상 실시','대표이사가 반기 1회 이상 실시','이사회가 연 2회 이상 실시','준법감시인이 분기 1회 이상 실시','감사가 연 1회 이상 실시'],a:0,
ex:'보고책임자는 교육 및 연수를 연 1회 이상 실시해야 한다. 독립적 감사 역시 연 1회 이상이지만 주체는 감사 또는 감사위원회이므로 구분해야 한다.'},

{id:'NK09',subject:EXTS.K,t:'basic',p:10,
q:'업무규정상 고객확인기록·금융거래기록 등의 보존기간 기산점과 기간으로 옳은 것은?',
ch:['거래가 발생한 날부터 3년 이상','금융거래관계가 종료된 때부터 5년 이상','계좌를 개설한 날부터 5년 이상','보고서를 작성한 날부터 10년 이상','고객확인을 이행한 날부터 5년 이상'],a:1,
ex:'금융거래관계가 종료된 때부터 5년 이상이다. 기산점이 거래 발생일이 아니라 거래관계 종료 시점이라는 점이 자주 출제된다.'},

{id:'NK10',subject:EXTS.K,t:'basic',p:10,
q:'업무규정상 의심되는 거래의 내부보고체제에 관한 설명으로 옳은 것은?',
ch:['보고서 작성자가 곧바로 보고 여부 검토자를 겸하는 것이 원칙이다','보고 여부 검토자 또는 보고책임자는 보고서 작성자가 될 수 없으나, 소규모 금융회사등은 예외로 한다','지점 직원은 반드시 담당책임자를 거쳐야 하며 보고책임자에게 직접 보고할 수 없다','보고서 작성 없이 보고하는 방식은 허용되지 않는다','내부보고체제는 금융정보분석원장이 직접 수립한다'],a:1,
ex:'상호 견제를 위해 작성자와 검토자·보고책임자의 분리를 요구하되, 인력이 제한된 소규모 금융회사등은 예외를 인정한다. 지점 직원이 보고책임자에게 직접 보고하거나 보고서 작성 없이 보고하는 방식도 참고 방법으로 제시되어 있다.'},

{id:'NK11',subject:EXTS.K,t:'basic',p:5,
q:'우리나라 금융정보분석원(KoFIU)에 관한 설명으로 옳지 않은 것은?',
ch:['2001년 설립되었다','의심거래보고와 고액현금거래보고를 수집·분석한다','분석 결과를 법집행기관에 제공한다','수사기관으로서 직접 수사·기소 권한을 가진다','에그몽 그룹 회원으로 해외 FIU와 정보를 교환한다'],a:3,
ex:'KoFIU는 행정형 FIU로 수사·기소 권한이 없다. 의심거래보고의 보고는 고발이 아니며, 분석 후 필요한 경우 검찰·경찰·국세청 등 법집행기관에 정보를 제공하는 구조다.'},

{id:'NK12',subject:EXTS.K,t:'basic',p:10,
q:'특정금융정보법과 범죄수익은닉규제법의 관계에 대한 설명으로 옳은 것은?',
ch:['특정금융정보법은 처벌·몰수를, 범죄수익은닉규제법은 보고의무를 규정한다','특정금융정보법은 보고·정보분석 체계를, 범죄수익은닉규제법은 자금세탁행위의 처벌과 범죄수익 몰수를 규정한다','두 법은 동일한 내용을 중복 규정한다','범죄수익은닉규제법은 가상자산사업자에게만 적용된다','특정금융정보법에는 벌칙 규정이 전혀 없다'],a:1,
ex:'특정금융정보법이 보고·분석·정보제공의 행정 체계라면, 범죄수익은닉규제법은 자금세탁행위 자체를 범죄로 처벌하고 범죄수익을 몰수·추징하는 형사법이다. 특정금융정보법에도 미보고·누설에 대한 벌칙은 별도로 있다.'},

{id:'NK13',subject:EXTS.K,t:'case',p:15,
q:'[사례·최신개정] 2026년 8월 20일 시행되는 특정금융정보법 개정에 따라 가상자산사업자 X는 신고사항을 재점검하고 있다. X의 최대주주는 법인 Y이며, Y의 주요 경영사항에 사실상 영향력을 행사하는 개인 Z가 있다. Y의 임원 중 1인은 3년 전 조세범 처벌법 위반으로 벌금형을 선고받았다.\n\n개정 법령에 비추어 X가 검토해야 할 사항으로 가장 적절한 것은?',
ch:['대주주 관련 사항은 신고사항이 아니므로 검토 대상이 아니다','대주주 관련 사항이 신고사항에 추가되었고, 신고 불수리 사유의 인적 범위에 대주주가 포함되었으므로 Y·Z 및 관련자의 결격 여부를 점검해야 한다','벌금형은 어떠한 경우에도 결격사유가 되지 않는다','최대주주가 법인인 경우에는 그 배후의 영향력 행사자는 고려 대상에서 제외된다','개정 사항은 신규 신고자에게만 적용되고 기존 사업자에게는 전혀 영향이 없다'],a:1,
ex:'개정법은 신고사항에 대주주 관련 사항을 추가하고, 대주주에 최대주주의 특수관계인인 주주와 최대주주가 법인인 경우 그 법인의 주요 경영사항에 사실상 영향력을 행사하는 자를 포함시켰다. 또한 불수리 사유의 인적 범위에 대표자·임원에 더해 대주주가 포함되고, 관련 법률의 범위도 조세범 처벌법·공정거래법·가상자산이용자보호법 등으로 확대되었다. (2026.8.20 시행 — 시험일보다 앞서므로 출제 가능)'},

{id:'NK14',subject:EXTS.K,t:'basic',p:10,
q:'[최신개정] 2026년 8월 20일 시행 특정금융정보법상 가상자산사업자 신고 불수리 사유에 관한 설명으로 옳지 않은 것은?',
ch:['정보보호 관리체계 인증을 획득하지 못한 자','실명확인이 가능한 입출금 계정을 통해 금융거래등을 하지 않는 자','일정 법률 위반으로 벌금 이상의 형을 받고 집행 종료·면제일부터 5년이 지나지 않은 자','건전한 재무상태 또는 사회적 신용을 갖추지 못한 자','신고 또는 변경신고가 말소되고 3년이 지나지 않은 자'],a:4,
ex:'말소 후 경과기간은 3년이 아니라 5년이다. 4번의 재무상태·사회적 신용 요건은 개정으로 신설된 불수리 사유이며, 그 인적 범위에 대표자·임원과 함께 대주주가 포함된다. (2026.8.20 시행)'},

{id:'NK15',subject:EXTS.K,t:'basic',p:5,
q:'특정금융정보법 및 시행령상 가상자산사업자 신고의 유효기간과 갱신신고 기한으로 옳은 것은?',
ch:['유효기간 3년, 만료 45일 전까지 갱신신고','유효기간 5년, 만료 30일 전까지 갱신신고','유효기간 3년, 만료 30일 전까지 갱신신고','유효기간 1년, 만료 45일 전까지 갱신신고','유효기간 5년, 만료 45일 전까지 갱신신고'],a:0,
ex:'법은 5년 이하의 범위에서 대통령령으로 정하도록 위임하고 있고, 시행령이 3년으로 정하고 있다. 갱신신고는 유효기간 만료 45일 전까지 제출해야 한다. 법률의 상한(5년)과 실제 기간(3년)을 구분해서 외워야 한다.'},

{id:'NK16',subject:EXTS.K,t:'basic',p:10,
q:'특정금융정보법상 가상자산사업자가 취해야 할 조치에 해당하지 않는 것은?',
ch:['고객별로 거래내역을 분리하여 관리할 것','예치금을 고유재산과 구분하여 관리할 것','고객확인 조치가 모두 끝나지 않은 고객에 대해 거래를 제한할 것','신고·변경신고 의무를 이행하지 않은 가상자산사업자와는 영업 목적 거래를 하지 않을 것','자기 임직원이 자사를 통해 가상자산을 매매하는 행위를 전면 허용할 것'],a:4,
ex:'오히려 반대로, 자사 또는 특수관계인이 발행한 가상자산의 중개, 임직원의 자사 거래, 자기가 거래 상대방이 되는 행위 등에 대해서는 거래를 제한하는 기준을 마련·시행해야 한다.'},

{id:'NK17',subject:EXTS.K,t:'count',p:15,
q:'특정금융정보법상 의심거래보고 정보의 취급에 관한 설명이다. 옳은 것은 모두 몇 개인가?\n\nA. 의심거래보고 정보는 형사재판에서 증거로 사용할 수 없다.\nB. 금융회사 임직원은 보고한 사실을 그 거래 상대방에게 누설해서는 안 된다.\nC. 동일 금융회사 내부에서의 정보공유는 예외적으로 허용된다.\nD. 해당국 법령에 근거가 있는 외국금융정보분석기구와의 정보교환은 허용된다.\nE. 언론의 취재 요청이 있으면 공익 목적으로 제공할 수 있다.',
ch:['1개','2개','3개','4개','5개'],a:3,
ex:'A·B·C·D 4개가 옳다. E는 명백히 틀렸다 — 정보공유의 예외는 동일 금융회사 내부와 외국금융정보분석기구 두 가지뿐이며 언론 제공은 누설에 해당한다.'},

{id:'NK18',subject:EXTS.K,t:'basic',p:10,
q:'[최신개정] 2026년 8월 20일 시행 특정금융정보법 개정 내용에 관한 설명으로 가장 거리가 먼 것은?',
ch:['가상자산사업자 신고사항에 대주주 관련 사항이 추가되었다','신고 불수리 사유의 인적 범위에 대주주가 포함되었다','신고 불수리와 관련된 법률의 범위가 조세범 처벌법 등으로 확대되었다','퇴임한 임원 등에 대한 조치내용 통보 규정이 신설되었다','고액현금거래보고 기준금액이 1천만원에서 500만원으로 인하되었다'],a:4,
ex:'CTR 기준금액은 2019년 7월 이후 1천만원으로 유지되고 있으며 이번 개정과 무관하다. 나머지는 2026.8.20 시행 개정 내용이다.'},

/* ================= 위험과 방법 (5) ================= */

{id:'NT01',subject:EXTS.T,t:'basic',p:10,
q:'위장회사(Shell Company)와 전위사업체(Front Company)의 구분 기준으로 가장 적절한 것은?',
ch:['설립 국가가 국내인지 해외인지','실제 영업활동과 물리적 실체의 존재 여부','자본금 규모의 크기','주주가 개인인지 법인인지','상장 여부'],a:1,
ex:'위장회사는 실질적 영업이나 물리적 실체 없이 서류상으로만 존재하는 회사이고, 전위사업체는 실제 영업활동을 하면서 그 수익에 범죄수익을 섞어 세탁하는 회사다. 물리적 실체와 실제 영업의 유무가 핵심 구분점이다.'},

{id:'NT02',subject:EXTS.T,t:'combo',p:10,
q:'무역기반 자금세탁(TBML)의 전형적 수법에 해당하는 것을 모두 고른 것은?\n\nA. 송장 금액을 실제보다 높게 기재(Over-invoicing)\nB. 동일 화물에 대해 여러 장의 송장을 발행(Multiple invoicing)\nC. 실제 선적 없이 서류만 유통(Phantom shipping)\nD. 물품의 수량·품질을 실제와 다르게 기재',
ch:['A, B','A, B, C','B, C, D','A, C, D','A, B, C, D'],a:4,
ex:'모두 TBML의 대표적 수법이다. 무역거래는 금액·수량·품질의 객관적 평가가 어렵고 다국적 서류가 개입되어 자금세탁에 취약하다.'},

{id:'NT03',subject:EXTS.T,t:'basic',p:5,
q:'하왈라(Hawala) 등 대체송금시스템의 자금세탁 위험 요인으로 가장 적절한 것은?',
ch:['거래 기록과 고객확인이 미흡하고 실제 자금이 국경을 넘지 않아 추적이 어렵다','거래 수수료가 높아 이용자가 적다','반드시 은행을 경유하므로 감독이 용이하다','거래 금액에 법정 상한이 있어 대규모 세탁이 불가능하다','모든 거래가 전산으로 기록되어 투명하다'],a:0,
ex:'하왈라는 중개인 간 상계(netting)로 정산되어 실제 자금 이동이 국경을 넘지 않고, 공식 기록과 고객확인이 미흡해 자금 흐름 추적이 어렵다. FATF 권고 14의 MVTS 규율 대상이다.'},

{id:'NT04',subject:EXTS.T,t:'case',p:15,
q:'[사례] 고객 A는 3개 영업점을 돌며 같은 날 900만원, 850만원, 950만원을 각각 현금 입금했다. 다음 날에도 유사한 패턴이 반복되었고, 입금 후 즉시 타인 명의 계좌로 이체되었다.\n\n이 거래에 대한 판단으로 가장 적절한 것은?',
ch:['각 건이 1천만원 미만이므로 고액현금거래보고 대상이 아니고, 의심거래보고 대상도 아니다','고액현금거래보고 기준 회피 목적의 분할거래(스머핑)로 볼 수 있어 의심거래보고를 검토해야 한다','현금 입금은 자금세탁 3단계 중 통합 단계에 해당한다','타인 명의 계좌 이체는 자금세탁과 무관한 정상 거래이다','건별 금액이 기준 미만이면 금융회사는 어떠한 보고의무도 부담하지 않는다'],a:1,
ex:'동일인이 같은 날 여러 영업점에서 기준금액 직하 금액을 반복 입금하는 것은 전형적 분할거래(스머핑)다. 고액현금거래보고는 동일 금융회사 기준 1거래일 합산이므로 합산 시 기준을 넘을 수 있고, 설령 넘지 않더라도 의심거래보고에는 금액 기준이 없다. 현금 입금은 예치(배치) 단계다.'},

{id:'NT05',subject:EXTS.T,t:'basic',p:10,
q:'가상자산을 이용한 자금세탁 수법에 관한 설명으로 옳지 않은 것은?',
ch:['믹싱·텀블러 서비스로 거래 흐름을 단절시킨다','전송기록 추적이 어려운 익명성 강화 코인을 이용한다','다수의 지갑 주소로 잘게 나누어 반복 이전한다','탈중앙화 거래소나 P2P 거래로 고객확인 절차를 회피한다','블록체인은 공개 원장이므로 자금세탁에 이용될 여지가 전혀 없다'],a:4,
ex:'공개 원장이라는 특성은 추적 가능성을 높이지만, 지갑 주소와 실제 신원의 연결이 끊기면 추적이 무력화된다. 특히 전송기록이 식별되지 않는 익명성 강화 코인은 가상자산사업자가 취급하지 않도록 관리해야 하는 대상이다.'},

/* ================= 위험평가 (5) ================= */

{id:'NR01',subject:EXTS.R,t:'basic',p:10,
q:'자금세탁 위험을 구성하는 세 가지 요소로 옳은 것은?',
ch:['위협(Threat), 취약성(Vulnerability), 결과(Consequence)','고객, 상품, 국가','발생가능성, 영향도, 통제수준','예방, 적발, 대응','설계, 운영, 평가'],a:0,
ex:'FATF는 위험을 위협·취약성·결과의 함수로 본다. 2번의 국가·고객·상품 및 서비스는 업무규정이 위험평가에 반영하도록 한 위험 유형 구분이므로 혼동하지 않아야 한다.'},

{id:'NR02',subject:EXTS.R,t:'basic',p:10,
q:'업무규정상 금융회사등이 위험평가 시 반영하여야 할 위험 유형으로 가장 적절한 것은?',
ch:['국가위험, 고객위험, 상품 및 서비스 위험','신용위험, 시장위험, 운영위험','법률위험, 평판위험, 전략위험','유동성위험, 금리위험, 환위험','내부위험, 외부위험, 복합위험'],a:0,
ex:'업무규정은 국가·고객·상품 및 서비스 위험을 위험평가에 반영하도록 하고 있다. 2번 이하는 금융회사의 일반 리스크 분류로 AML 위험평가 체계와 다르다.'},

{id:'NR03',subject:EXTS.R,t:'count',p:15,
q:'업무규정상 금융회사등의 위험평가 관련 조치에 관한 설명이다. 옳은 것은 모두 몇 개인가?\n\nA. 위험평가 결과를 문서화하여야 한다.\nB. 위험평가 결과를 지속적으로 최신 상태로 유지하여야 한다.\nC. 경영진의 승인을 거친 정책·통제·절차를 구비하여야 한다.\nD. 위험이 높은 것으로 확인된 분야에 대해 강화된 조치를 수행하여야 한다.\nE. 위험평가 정보를 금융정보분석원장 및 검사수탁기관의 장에게 제공하기 위한 운영체계를 구축하여야 한다.',
ch:['1개','2개','3개','4개','5개'],a:4,
ex:'A부터 E까지 모두 옳다. 개수형은 하나만 오답으로 만들어 함정을 파는 경우가 많지만, 전부 옳은 구성도 출제되므로 각 항목을 개별 판단해야 한다.'},

{id:'NR04',subject:EXTS.R,t:'basic',p:10,
q:'업무규정상 위험관리수준 평가에 관한 설명으로 옳은 것은?',
ch:['금융회사등이 감독기관을 평가하는 제도이다','금융정보분석원장이 금융회사등의 위험 대응 조치 적정성을 주기적으로 평가하는 제도이다','3년마다 1회 실시하는 것이 원칙이다','평가 결과는 검사수탁기관과 공유할 수 없다','평가 대상은 은행에 한정된다'],a:1,
ex:'금융정보분석원장은 금융회사등이 내재 위험에 상응하는 조치를 취하고 있는지 주기적으로 평가하고, 그 결과를 검사수탁기관의 장과 공유해 감독·검사·교육에 활용한다.'},

{id:'NR05',subject:EXTS.R,t:'basic',p:5,
q:'국가 자금세탁·테러자금조달 위험평가(NRA)에 관한 설명으로 가장 적절한 것은?',
ch:['개별 금융회사가 자사 고객을 평가하는 절차이다','국가 차원에서 자금세탁·테러자금조달 위험을 식별·평가하여 자원 배분과 정책 우선순위를 정하는 절차이다','FATF가 회원국을 대신해 수행한다','평가 결과는 대외에 일절 공개할 수 없다','금융회사의 위험평가와 아무런 관련이 없다'],a:1,
ex:'NRA는 FATF 권고 1에 근거한 국가 단위 위험평가로, 그 결과는 위험기반 자원 배분의 기초가 되며 금융회사가 자체 위험평가를 수행할 때 반영해야 하는 상위 입력값이 된다.'},

/* ================= CDD (8) ================= */

{id:'NC01',subject:EXTS.C,t:'basic',p:10,
q:'정치적 주요인물(PEP)에 관한 설명으로 옳지 않은 것은?',
ch:['외국의 PEP는 위험도와 무관하게 강화된 고객확인 대상으로 본다','국내 PEP와 국제기구 PEP도 PEP의 범주에 포함된다','PEP의 가족과 밀접한 관계에 있는 자도 관리 대상이 된다','PEP에 해당하면 그 자체로 자금세탁 범죄자로 확정된다','공직에서 물러난 후에도 일정 기간 위험을 고려할 수 있다'],a:3,
ex:'PEP는 지위로 인해 부패·뇌물 등에 노출될 위험이 상대적으로 높다는 위험 지표일 뿐, 범죄자로 단정하는 개념이 아니다. FATF 권고 12는 위험 관리 수단을 요구하는 것이지 거래 거절을 요구하지 않는다.'},

{id:'NC02',subject:EXTS.C,t:'combo',p:10,
q:'PEP로 확인된 고객과 거래관계를 수립하거나 유지할 때 요구되는 조치를 모두 고른 것은?\n\nA. 거래관계 수립·유지에 대한 고위경영진의 승인\nB. 재산 및 자금의 원천 확인을 위한 합리적 조치\nC. 거래관계에 대한 강화된 지속적 모니터링\nD. 고객 신원확인의 전면 생략',
ch:['A, B','A, B, C','B, C, D','A, C, D','A, B, C, D'],a:1,
ex:'A·B·C가 옳다. D는 정반대로, PEP는 강화된 고객확인 대상이므로 신원확인을 생략할 수 없다.'},

{id:'NC03',subject:EXTS.C,t:'count',p:15,
q:'고객확인의무 적용 기준에 관한 설명이다. 옳은 것은 모두 몇 개인가?\n\nA. 계좌의 신규 개설은 거래금액과 무관하게 고객확인 대상이다.\nB. 일회성 금융거래는 원화 1천만원 이상이면 대상이 된다.\nC. 외화의 경우 미화 1만불 상당 이상이면 대상이 된다.\nD. 연결거래는 7일 동안 합산한 금액을 기준으로 판단한다.\nE. 고액현금거래보고의 합산 기준은 1거래일이다.',
ch:['1개','2개','3개','4개','5개'],a:4,
ex:'A부터 E까지 모두 옳다. 특히 연결거래 합산은 7일, 고액현금거래보고 합산은 1거래일로 기간이 다르다는 점이 반복 출제되는 함정이다.'},

{id:'NC04',subject:EXTS.C,t:'basic',p:10,
q:'법인 고객의 실제소유자 확인 절차에 관한 설명으로 옳은 것은?',
ch:['대표이사를 먼저 확인하고 그다음 주주를 확인한다','25퍼센트 이상 지분을 소유한 자를 우선 확인하고, 확인할 수 없는 경우 다음 단계로 이행한다','법인등기부등본상 임원 전원을 실제소유자로 본다','자본금 규모가 큰 법인은 실제소유자 확인을 생략한다','실제소유자는 반드시 1인만 존재한다'],a:1,
ex:'25퍼센트 이상 지분 보유 개인을 우선 확인하고, 없거나 확인이 어려우면 최다 지분 보유자 등 다음 단계로, 그래도 확인되지 않으면 대표자 등을 확인하는 단계적 구조다. 실제소유자가 복수일 수도 있다.'},

{id:'NC05',subject:EXTS.C,t:'case',p:15,
q:'[사례] 신규 법인 고객 B사의 주주는 甲 40퍼센트, 乙 30퍼센트, 丙 30퍼센트이며, 甲은 해외 소재 법인이다. 甲의 주주 구성은 서류상 확인이 어렵고, B사는 설립 3개월 차로 사업장 실체가 뚜렷하지 않으며 개설 직후 고액 해외송금이 예정되어 있다.\n\n금융회사의 대응으로 가장 적절한 것은?',
ch:['지분 25퍼센트 이상 주주가 존재하므로 추가 확인 없이 甲을 실제소유자로 기재하고 거래를 개시한다','甲의 최종 실제소유자 확인이 곤란하고 위험요소가 중첩되므로 강화된 고객확인을 수행하고, 확인이 어려우면 거래 거절·종료 및 의심거래보고를 검토한다','법인 고객이므로 실제소유자 확인 의무가 없다','해외송금은 외국환거래법 사안이므로 자금세탁방지 관점의 검토는 불필요하다','설립 3개월 차 신설법인은 위험이 낮으므로 간소화된 고객확인을 적용한다'],a:1,
ex:'해외 소재 주주로 인한 최종 실제소유자 추적 곤란, 실체 불분명, 개설 직후 고액 해외송금 예정이라는 위험요소가 중첩된다. 고객확인을 할 수 없는 경우 신규 거래를 거절하고 기존 거래를 종료할 수 있으며, 이 경우 의심거래보고 여부를 별도로 검토해야 한다. 위험이 높게 평가되면 간소화된 고객확인은 적용할 수 없다.'},

{id:'NC06',subject:EXTS.C,t:'basic',p:10,
q:'간소화된 고객확인을 적용할 수 없는 경우에 해당하는 것은?',
ch:['자금세탁행위등이 의심되거나 위험이 높은 것으로 평가되는 경우','거래금액이 소액인 경우','국내 거주 개인 고객인 경우','장기 거래관계를 유지해 온 고객인 경우','공과금 수납 거래인 경우'],a:0,
ex:'자금세탁이 의심되거나 위험이 높게 평가되는 경우, 그리고 외국인 고객이 FATF 권고사항을 효과적으로 이행하는 국가의 국민(법인 포함)이 아닌 경우에는 간소화된 고객확인을 적용할 수 없다. 또한 간소화하더라도 고객 신원확인 자체는 생략할 수 없다.'},

{id:'NC07',subject:EXTS.C,t:'basic',p:5,

const QP = function(q){ return q && q.p ? q.p : 10; };          // 배점(기본 10)
const QT = function(q){ return q && q.t ? q.t : 'basic'; };     // 유형(기본 basic)

/* 1,000점 환산: 획득 배점 합 / 총 배점 합 x 1000 */
function scoreTo1000(questions, answers){
  var got = 0, tot = 0;
  questions.forEach(function(q, i){
    var p = QP(q);
    tot += p;
    if (answers[i] === q.a) got += p;
  });
  return tot ? Math.round(got / tot * 1000) : 0;
}

/* --- Drive: 파일 검색 --- */
async function driveFindFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`,{
    headers:{ 'Authorization': 'Bearer '+accessToken }
  });
  if(!r.ok) throw new Error('drive search '+r.status);
  const d = await r.json();
  return (d.files && d.files.length) ? d.files[0] : null;
}

/* --- Drive: 내용 읽기 --- */
async function driveRead(id){
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{
    headers:{ 'Authorization': 'Bearer '+accessToken }
  });
  if(!r.ok) throw new Error('drive read '+r.status);
  return await r.json();
}

/* --- Drive: 생성 --- */
async function driveCreate(obj){
  const boundary = 'aml'+Date.now();
  const meta = { name: DRIVE_FILENAME, mimeType: 'application/json' };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify(meta) +
    `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
    JSON.stringify(obj) +
    `\r\n--${boundary}--`;
  const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
    method:'POST',
    headers:{ 'Authorization':'Bearer '+accessToken, 'Content-Type':`multipart/related; boundary=${boundary}` },
    body
  });
  if(!r.ok) throw new Error('drive create '+r.status);
  const d = await r.json();
  return d.id;
}

/* --- Drive: 갱신 --- */
async function driveUpdate(id, obj){
  const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{
    method:'PATCH',
    headers:{ 'Authorization':'Bearer '+accessToken, 'Content-Type':'application/json' },
    body: JSON.stringify(obj)
  });
  if(!r.ok) throw new Error('drive update '+r.status);
  return true;
}

/* --- 병합: 3기기 기록이 섞여도 유실 없게 --- */
function mergeState(a, b){
  if(!a) return b; if(!b) return a;
  const out = { history: [], wrongNotes: {}, memos: [] };

  // history: ts 기준 중복 제거 후 시간순
  const hmap = {};
  [...(a.history||[]), ...(b.history||[])].forEach(h=>{ if(h && h.ts) hmap[h.ts]=h; });
  out.history = Object.values(hmap).sort((x,y)=>x.ts-y.ts).slice(-120);

  // wrongNotes: 같은 문제면 최신 것 채택
  const wa = a.wrongNotes||{}, wb = b.wrongNotes||{};
  Object.keys({...wa, ...wb}).forEach(k=>{
    const x = wa[k], y = wb[k];
    if(x && y) out.wrongNotes[k] = (x.ts>=y.ts)? x : y;
    else out.wrongNotes[k] = x || y;
  });

  // memos: id 기준 중복 제거
  const mmap = {};
  [...(a.memos||[]), ...(b.memos||[])].forEach(m=>{ if(m && m.id) mmap[m.id]=m; });
  out.memos = Object.values(mmap).sort((x,y)=>y.ts-x.ts);

  return out;
}

/* --- 로드 --- */
async function loadState(){
  const local = localLoad();
  if(local) appState = local;
  if(!appState.history) appState.history=[];
  if(!appState.wrongNotes) appState.wrongNotes={};
  if(!appState.memos) appState.memos=[];
  renderQuiz(); renderNotes(); renderMemo(); renderStats();

  // 저장된 토큰이 있으면 자동으로 드라이브 동기화 시도
  const saved = (()=>{ try{ return JSON.parse(localStorage.getItem(TOKEN_KEY)||'null'); }catch(e){ return null; } })();
  if(saved && saved.token && saved.exp > Date.now()){
    accessToken = saved.token;
    syncFromDrive();
  }
}

/* --- 저장 (로컬 즉시 + 드라이브 지연) --- */
function saveState(){
  if(appState.history.length>120) appState.history = appState.history.slice(-120);
  localSave();
  if(accessToken){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(pushToDrive, 1200);
  }
}

/* --- 드라이브에서 받아와 병합 --- */
async function syncFromDrive(){
  if(!accessToken || syncing) return;
  syncing = true;
  setSyncState('동기화 중...', '');
  try{
    let f = await driveFindFile();
    if(f){
      driveFileId = f.id;
      const remote = await driveRead(f.id);
      appState = mergeState(appState, remote);
      localSave();
      await driveUpdate(driveFileId, appState);
    }else{
      driveFileId = await driveCreate(appState);
    }
    renderQuiz(); renderNotes(); renderMemo(); renderStats();
    setSyncState('드라이브 동기화됨', 'ok');
    setSyncBtn('지금 동기화');
  }catch(e){
    console.error(e);
    if((''+e.message).includes('401') || (''+e.message).includes('403')){
      accessToken = null;
      localStorage.removeItem(TOKEN_KEY);
      setSyncState('재로그인 필요', 'err');
      setSyncBtn('구글 드라이브 연결');
    }else{
      setSyncState('동기화 실패 (로컬 보관됨)', 'err');
    }
  }
  syncing = false;
}

/* --- 드라이브로 밀어넣기 --- */
async function pushToDrive(){
  if(!accessToken) return;
  try{
    if(!driveFileId){
      const f = await driveFindFile();
      driveFileId = f ? f.id : await driveCreate(appState);
      if(f){ const remote = await driveRead(f.id); appState = mergeState(appState, remote); localSave(); }
    }
    await driveUpdate(driveFileId, appState);
    const t = new Date();
    setSyncState(`저장됨 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`, 'ok');
  }catch(e){
    console.error(e);
    setSyncState('저장 실패 (로컬 보관됨)', 'err');
  }
}

/* --- 로그인 --- */
function handleAuthClick(){
  if(accessToken){ syncFromDrive(); return; }
  if(!tokenClient){
    if(!window.google || !google.accounts || !google.accounts.oauth2){
      setSyncState('구글 로그인 준비 중, 잠시 후 다시', 'err');
      return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (resp)=>{
        if(resp.error){ setSyncState('로그인 취소됨', 'err'); return; }
        accessToken = resp.access_token;
        const exp = Date.now() + ((resp.expires_in||3500)*1000) - 60000;
        try{ localStorage.setItem(TOKEN_KEY, JSON.stringify({token:accessToken, exp})); }catch(e){}
        syncFromDrive();
      }
    });
  }
  tokenClient.requestAccessToken({ prompt: '' });
}

/* ---------- 유틸 ---------- */
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickWeighted(total){
  let raw = SUBJECTS.map(k=>({k, exact: WEIGHTS[k]*total}));
  let counts = raw.map(r=>({k:r.k, n: Math.floor(r.exact), rem: r.exact-Math.floor(r.exact)}));
  let assigned = counts.reduce((s,c)=>s+c.n,0);
  let remainder = total - assigned;
  let order = counts.slice().sort((a,b)=>b.rem-a.rem);
  for(let i=0;i<remainder;i++){ order[i % order.length].n++; }
  let result=[];
  order.forEach(c=>{
    const pool = shuffle(BANK.filter(q=>q.subject===c.k));
    result.push(...pool.slice(0, Math.min(c.n, pool.length)));
  });
  return shuffle(result);
}
function pickQuestions(subject, count){
  if(subject==='ALL') return pickWeighted(count);
  const pool = shuffle(BANK.filter(q=>q.subject===subject));
  return pool.slice(0, Math.min(count, pool.length));
}

/* ---------- 모의고사 탭 ---------- */
function renderQuiz(){
  const el = document.getElementById('tab-quiz');
  if(session){ renderSessionView(el); return; }
  let chips = '<div class="chiprow">';
  chips += `<button class="chip ${quizSubject==='ALL'?'active':''}" onclick="setSubject('ALL')">전체비중</button>`;
  SUBJECTS.forEach(s=>{ chips += `<button class="chip ${quizSubject===s?'active':''}" onclick="setSubject('${s}')">${s}</button>`; });
  chips += '</div>';

  const counts = [10,20,50,100];
  let countRow = '<div class="countrow">';
  counts.forEach(c=>{
    const label = c===100?'실전(100)':c;
    countRow += `<button class="countbtn ${quizCount===c?'active':''}" onclick="setCount(${c})">${label}</button>`;
  });
  countRow += '</div>';

  el.innerHTML = `
    <div class="card">
      <p class="sectionlabel">과목 선택</p>
      ${chips}
      <p class="sectionlabel">문항 수</p>
      ${countRow}
      <button class="bigbtn" onclick="startQuiz()">모의고사 시작</button>
    </div>
  `;
}
function setSubject(s){ quizSubject=s; renderQuiz(); }
function setCount(c){ quizCount=c; renderQuiz(); }

function startQuiz(){
  const qs = pickQuestions(quizSubject, quizCount);
  if(qs.length===0){ return; }
  session = { questions: qs, index:0, answers:{}, locked:{} };
  renderQuiz();
}

function renderSessionView(el){
  if(session.index >= session.questions.length){ renderResult(el); return; }
  const q = session.questions[session.index];
  const answered = session.answers[q.id] !== undefined;
  const pct = Math.round((session.index/session.questions.length)*100);

  let choicesHtml = '';
  q.ch.forEach((c,i)=>{
    let cls='choice';
    if(answered){
      if(i===q.a) cls+=' correct';
      else if(i===session.answers[q.id]) cls+=' wrong';
    } else if(session.answers[q.id]===i){ cls+=' selected'; }
    choicesHtml += `<button class="${cls}" ${answered?'data-locked="1"':''} onclick="selectChoice('${q.id}',${i})"><span class="num">${i+1}</span><span>${c}</span></button>`;
  });

  el.innerHTML = `
    <div class="progresswrap">
      <span>${session.index+1} / ${session.questions.length}</span>
      <div class="progressbar"><div style="width:${pct}%"></div></div>
    </div>
    <div class="card">
      <span class="qtag">${q.subject} · ${q.id}</span>
      <span class="qtag">${QT_LABEL[QT(q)]} · ${QP(q)}점</span>
      <p class="qtext">${q.q}</p>
      ${choicesHtml}
      ${answered?`<div class="explain">${q.ex}</div>`:''}
    </div>
    <div class="navrow">
      <button class="bigbtn secondary" onclick="exitQuiz()">중단</button>
      <button class="bigbtn" ${answered?'':'disabled style="opacity:.4"'} onclick="nextQuestion()">${session.index+1===session.questions.length?'결과 보기':'다음 문제'}</button>
    </div>
  `;
}
function selectChoice(qid, idx){
  if(session.answers[qid]!==undefined) return;
  session.answers[qid]=idx;
  const q = session.questions.find(x=>x.id===qid);
  if(q){
    if(idx!==q.a){
      appState.wrongNotes[q.id] = { id:q.id, subject:q.subject, q:q.q, ch:q.ch, a:q.a, ex:q.ex, chosen: idx, ts: Date.now() };
      saveState();
    } else if(appState.wrongNotes[q.id]){
      delete appState.wrongNotes[q.id];
      saveState();
    }
    renderNotes(); renderMemo();
  }
  renderQuiz();
}
function nextQuestion(){
  const q = session.questions[session.index];
  if(session.answers[q.id]===undefined) return;
  session.index++;
  renderQuiz();
}
function exitQuiz(){ session=null; renderQuiz(); }

function renderResult(el){
  const qs = session.questions;
  let correct=0; const breakdown={};
  SUBJECTS.forEach(s=>breakdown[s]={correct:0,total:0});
  qs.forEach(q=>{
    if(!breakdown[q.subject]) breakdown[q.subject]={correct:0,total:0};
    breakdown[q.subject].total++;
    const ok = session.answers[q.id]===q.a;
    if(ok){ breakdown[q.subject].correct++; correct++; }
  });
  const total = qs.length;
  const pct = total? Math.round((correct/total)*100) : 0;
  /* 배점 가중 환산점수.
     scoreTo1000 은 answers[i] (인덱스 기반) 을 기대하지만
     session.answers 는 문항 id 기반이므로 인덱스 배열로 변환해 넘긴다. */
  const score1000 = scoreTo1000(qs, qs.map(q => session.answers[q.id]));
  let tier='재도전', pass=false;
  if(score1000>=900){tier='1+등급';pass=true;}
  else if(score1000>=800){tier='1등급';pass=true;}
  else if(score1000>=700){tier='2등급';pass=true;}
  else if(score1000>=600){tier='3등급';pass=true;}

  // 저장: 오답노트 갱신 + 기록 추가
  qs.forEach(q=>{
    const ok = session.answers[q.id]===q.a;
    if(!ok){
      appState.wrongNotes[q.id] = {
        id:q.id, subject:q.subject, q:q.q, ch:q.ch, a:q.a, ex:q.ex,
        chosen: session.answers[q.id], ts: Date.now()
      };
    } else if(appState.wrongNotes[q.id]){
      delete appState.wrongNotes[q.id]; // 다시 맞히면 오답노트에서 제외(마스터)
    }
  });
  const hist = { ts: Date.now(), subjectMode: quizSubject, total, correct, breakdown };
  appState.history.push(hist);
  saveState();
  renderNotes(); renderMemo(); renderStats();

  let breakRows='';
  Object.keys(breakdown).forEach(s=>{
    const b=breakdown[s]; if(b.total===0) return;
    const p = Math.round((b.correct/b.total)*100);
    breakRows += `<div class="breakrow"><span>${s}</span><div class="breakbar"><div style="width:${p}%"></div></div><span>${b.correct}/${b.total}</span></div>`;
  });

  let wrongList='';
  qs.filter(q=>session.answers[q.id]!==q.a).forEach(q=>{
    wrongList += `
      <div class="note-card">
        <span class="qtag">${q.subject} · ${q.id}</span>
        <p class="qtext" style="font-size:14.5px;">${q.q}</p>
        <div class="note-line wrong">✕ 선택: ${q.ch[session.answers[q.id]]}</div>
        <div class="note-line correct">✓ 정답: ${q.ch[q.a]}</div>
        <div class="explain">${q.ex}</div>
      </div>`;
  });

  el.innerHTML = `
    <div class="resulthead"><span class="big">${quizSubject==='ALL'?'전체비중':quizSubject} · ${total}문항</span></div>
    <div class="stampwrap">
      <div class="stamp ${pass?'':'fail'}">
        <span class="top">TPAC 모의</span>
        <span class="score">${pct}%</span>
        <span class="tier">${tier}</span>
      </div>
    </div>
    <div class="resulthead" style="margin-top:8px;"><span class="big">환산점수 ${score1000} / 1000</span></div>
    <div class="card">
      <p class="sectionlabel">과목별 결과</p>
      ${breakRows}
    </div>
    ${wrongList? `<p class="sectionlabel" style="margin:4px 2px 8px;">오답 다시보기 (오답노트에 자동 저장됨)</p>${wrongList}` : `<div class="empty">전 문항 정답! 오답노트에 추가된 항목이 없어요.</div>`}
    <button class="bigbtn" onclick="restartFromResult()">새 모의고사</button>
  `;
}
function restartFromResult(){ session=null; renderQuiz(); }

function setNotesFilter(s){ notesFilter=s; renderNotes(); }
function retryWrong(){
  const all = Object.values(appState.wrongNotes);

  const qs = shuffle(target.map(n=>({id:n.id,subject:n.subject,q:n.q,ch:n.ch,a:n.a,ex:n.ex})));

function addMemo(){
  const ta = document.getElementById('memoInput');
  const text = ta ? ta.value.trim() : '';

  appState.memos.push({ id: 'm'+Date.now(), subject: memoFilter, text, ts: Date.now(), auto:false });
  memoDraft='';
  saveState();
  renderMemo();
}
function generateAutoMemo(subject){
  const items = Object.values(appState.wrongNotes).filter(n=>n.subject===subject);
  if(items.length===0) return null;
  const lines = [...new Set(items.map(n=>`· ${n.ex}`))];
  const d = new Date();
  const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
  return `[${dateStr} 기준 오답 ${items.length}건 요약]\n` + lines.join('\n');
}
function autoMemoFromWrong(){
  const text = generateAutoMemo(memoFilter);
  if(!text) return;
  appState.memos = appState.memos.filter(m => !(m.subject === memoFilter && m.auto === true));
  appState.memos.push({ id: 'm'+Date.now(), subject: memoFilter, text, ts: Date.now(), auto:true });
  saveState();
  renderMemo();
}
function deleteMemo(id){
  appState.memos = appState.memos.filter(m=>m.id!==id);
  saveState();
  renderMemo();
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- 통계 탭 ---------- */
function renderStats(){
  const el = document.getElementById('tab-stats');
  const hist = appState.history;
  if(hist.length===0){
    el.innerHTML = `<div class="empty">아직 모의고사 기록이 없어요. 첫 모의고사를 풀어보세요.</div>`;
    return;
  }
  let sumCorrect=0, sumTotal=0;
  const agg={};
  SUBJECTS.forEach(s=>agg[s]={correct:0,total:0});
  hist.forEach(h=>{
    sumCorrect+=h.correct; sumTotal+=h.total;
    Object.keys(h.breakdown||{}).forEach(s=>{
      if(!agg[s]) agg[s]={correct:0,total:0};
      agg[s].correct += h.breakdown[s].correct;
      agg[s].total += h.breakdown[s].total;
    });
  });
  const overallPct = sumTotal? Math.round((sumCorrect/sumTotal)*100):0;

  let subjectRows='';
  SUBJECTS.forEach(s=>{
    const b=agg[s]; if(b.total===0) return;
    const p=Math.round((b.correct/b.total)*100);
    subjectRows += `<div class="breakrow"><span>${s}</span><div class="breakbar"><div style="width:${p}%"></div></div><span>${p}%</span></div>`;
  });

  let recentRows='';
  hist.slice(-10).reverse().forEach(h=>{
    const d=new Date(h.ts);
    const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const p = h.total? Math.round((h.correct/h.total)*100):0;
    recentRows += `<div class="breakrow"><span style="font-family:'SFMono-Regular',Consolas,monospace;font-size:11.5px;">${dateStr}</span><span>${h.subjectMode==='ALL'?'전체비중':h.subjectMode}</span><span>${h.correct}/${h.total} (${p}%)</span></div>`;
  });

  el.innerHTML = `
    <div class="card statbig">
      <div class="num">${overallPct}%</div>
      <div class="lbl">전체 누적 정답률 · ${sumTotal}문항</div>
    </div>
    <div class="card">
      <p class="sectionlabel">과목별 정답률</p>
      ${subjectRows}
    </div>
    <div class="card">
      <p class="sectionlabel">최근 기록</p>
      ${recentRows}
    </div>
    <button class="footlink" onclick="resetAll()">전체 기록·오답노트·핵심정리 초기화</button>
  `;
}
function resetAll(){
  if(!confirm('모든 모의고사 기록, 오답노트, 핵심정리를 삭제할까요? 되돌릴 수 없어요.')) return;
  appState = { history: [], wrongNotes: {}, memos: [] };
  localSave();
  if(accessToken && driveFileId){ driveUpdate(driveFileId, appState).catch(e=>console.error(e)); }
  renderQuiz(); renderNotes(); renderMemo(); renderStats();
}

/* ---------- 초기화 ---------- */
(function setDate(){
  const now = new Date();
  const s = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  document.getElementById('dateBadge').textContent = s;
})();
loadState();
</script>
</body>
